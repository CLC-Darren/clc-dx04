<!DOCTYPE html>
<html lang="zh-TW" class="dark dx-locked">
<head>
  <link rel="stylesheet" href="/login-gate.css">
  <script src="/login-gate.js"></script>
  <script src="/reorder.js?v=drag-lift-3"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CLC DX04 | 總控台</title>

  <!-- PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CLC DX04">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase（登入與權限，版本與 YA 相同） -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"CLC Arial"', 'Arial', '"Microsoft JhengHei"', 'sans-serif'],
          },
          colors: {
            brand: {
              teal: '#007E8A',
              tealHover: '#006C77',
              surface: '#11131B',
              card: '#161924',
              border: 'rgba(255, 255, 255, 0.1)',
              muted: '#8A92A6',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  

  <style>
    html { font-size: 16px; }
    @media (min-width: 1024px) { html { font-size: 19px; } }
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    /* 待辦勾選圈與 App 格子 */
    .todo-item { display:flex; align-items:flex-start; gap:14px; min-height:44px; padding:8px 4px; cursor:pointer; }
    .todo-text { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
    .todo-title { font-size:1rem; color:#0f172a; }
    .dark .todo-title { color:#fff; }
    .todo-meta { font-size:0.8125rem; color:#64748b; }
    .dark .todo-meta { color:#8A92A6; }
    .todo-ck { appearance:none; -webkit-appearance:none; flex:none; width:22px; height:22px; margin-top:1px; border-radius:50%; border:2px solid #94a3b8; display:grid; place-content:center; cursor:pointer; background:transparent; transition:all .15s; }
    .dark .todo-ck { border-color:#4B5263; }
    .todo-ck.p1, .dark .todo-ck.p1 { border-color:#FB923C; }
    .todo-ck:checked, .dark .todo-ck:checked { background:#007E8A; border-color:#007E8A; }
    .todo-ck:checked::after { content:""; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:translateY(-1px) rotate(45deg); }
    .todo-ck:focus-visible { outline:2px solid #00A3B4; outline-offset:2px; }
    .app-tile { aspect-ratio:1; display:block; border-radius:22%; transition:transform .2s; }
    .app-tile:hover { transform:scale(1.05); }
    .app-tile:active { transform:scale(.95); }
    .app-tile:focus-visible { outline:2px solid #00A3B4; outline-offset:3px; }
    .app-logo, .app-fallback { display:block; width:100%; height:100%; border-radius:22%; object-fit:cover; }
    .app-fallback { display:grid; place-content:center; background:#007E8A; color:#fff; font-weight:800; font-size:1.5rem; }
    .app-slot { aspect-ratio:1; border-radius:22%; border:2px dashed #cbd5e1; color:#94a3b8; display:grid; place-content:center; font-size:1.75rem; font-weight:300; user-select:none; }
    .dark .app-slot { border-color:#334155; color:#475569; }
    /* 首頁區塊：電腦固定位置；手機依 DOM 順序，可拖曳 */
    @media (min-width: 1024px) {
      #dashGrid > [data-widget="todo"] { grid-column: 1; grid-row: 1 / span 2; }
      #dashGrid > [data-widget="apps"] { grid-column: 2; grid-row: 1; }
      #dashGrid > [data-widget="clock"] { grid-column: 2; grid-row: 2; }
    }
    .dash-widget { position:relative; }
    .drag-handle { position:absolute; top:0; left:50%; transform:translateX(-50%); width:56px; height:22px; display:flex; align-items:center; justify-content:center; background:none; border:0; padding:0; cursor:grab; touch-action:none; z-index:2; }
    .drag-handle span { width:36px; height:5px; border-radius:9999px; background:#cbd5e1; }
    .dark .drag-handle span { background:#334155; }
    .drag-handle:focus-visible { outline:2px solid #00A3B4; border-radius:8px; }
    .dash-widget.is-dragging { z-index:30; box-shadow:0 18px 40px rgba(0,0,0,.35); transition:none; }
    .dash-widget.is-dragging .drag-handle { cursor:grabbing; }
    .dash-widget.is-dragging .drag-handle span { background:#007E8A; }
    .dash-widget.is-dragging[data-widget="apps"] { background:#fff; border-radius:24px; }
    .dark .dash-widget.is-dragging[data-widget="apps"] { background:#161924; }
    body.dash-dragging { user-select:none; -webkit-user-select:none; }
    .app-tile[draggable="true"] { cursor:grab; }
    .app-tile { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
    .app-tile img { pointer-events:none; }
    .app-slot.is-admin { cursor:pointer; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
    .app-slot.is-admin:hover { border-color:#007E8A; color:#007E8A; }
    .app-pressing { transform:scale(.92) !important; transition:transform .5s; }
    .app-dialog::backdrop { background:rgba(0,0,0,.6); }
    .app-input { height:44px; padding:0 14px; border-radius:12px; font-weight:400; font-size:15px; background:#f1f5f9; border:1px solid #e2e8f0; color:inherit; outline:none; }
    .dark .app-input { background:rgba(255,255,255,.04); border-color:rgba(255,255,255,.1); }
    .app-input:focus { border-color:#007E8A; }
    .app-input[readonly] { opacity:.6; }
    /* 待辦列：勾選、刪除、群組、語音 */
    .todo-list { margin:0; padding:0; list-style:none; }
    .todo-row { display:flex; align-items:flex-start; gap:4px; border-bottom:1px solid #f1f5f9; }
    .dark .todo-row { border-bottom-color:rgba(255,255,255,.06); }
    .todo-list .todo-row:last-child { border-bottom:0; }
    .todo-row .todo-item { flex:1; min-width:0; cursor:default; }
    .todo-row { position:relative; touch-action:pan-y; }
    .todo-row > * { transform:translateX(var(--swipe,0px)); transition:transform .2s; }
    .todo-row.is-swiping > * { transition:none; }
    .todo-row.is-swiping, .todo-row.is-removing { background:linear-gradient(90deg,#e11d48 var(--swipe,0px),transparent var(--swipe,0px)); border-radius:10px; }
    .todo-row.is-swiping::before { content:"刪除"; position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#fff; font-size:.8125rem; font-weight:700; opacity:.6; }
    .todo-row.will-delete::before { opacity:1; }
    .todo-row.is-removing { opacity:0; transition:opacity .18s; }
    .todo-ck-hit { display:grid; place-content:center; margin:-11px; padding:11px; cursor:pointer; flex:none; }
    .todo-ck-hit .todo-ck { margin-top:0; }
    .todo-text { cursor:text; border-radius:6px; }
    .todo-text:focus-visible { outline:2px solid #00A3B4; outline-offset:2px; }
    .todo-edit { flex:1; min-width:0; height:36px; margin:-4px 0; padding:0 10px; border-radius:10px; border:1px solid #007E8A; background:transparent; color:inherit; font:inherit; font-size:1rem; outline:none; }
    .todo-title { overflow-wrap:anywhere; }
    .todo-row:has(.todo-ck:checked) .todo-title { text-decoration:line-through; opacity:.5; }
    .todo-meta.is-overdue { color:#ea580c; }
    .dark .todo-meta.is-overdue { color:#fb923c; }
    .todo-tag { color:#007E8A; }
    .dark .todo-tag { color:#00A3B4; }
    .todo-del { flex:none; width:44px; height:44px; display:grid; place-content:center; border:0; background:none; color:#94a3b8; border-radius:12px; cursor:pointer; opacity:.55; }
    .todo-del:hover, .todo-del:focus-visible { opacity:1; color:#e11d48; background:rgba(225,29,72,.08); }
    @media (hover:hover) { .todo-del { opacity:0; } .todo-row:hover .todo-del, .todo-del:focus-visible { opacity:1; } }
    /* 手機、平板：不顯示 ×，只能往右滑刪除（放在 .todo-del 之後，才不會被蓋掉） */
    @media (hover:none), (pointer:coarse), (max-width:1023px) { .todo-row .todo-del { display:none !important; } }
    .todo-group { margin:6px 0 0; font-size:.75rem; font-weight:700; letter-spacing:.05em; color:#64748b; }
    .dark .todo-group { color:#8A92A6; }
    .todo-group.is-overdue { color:#ea580c; }
    .dark .todo-group.is-overdue { color:#fb923c; }
    .todo-empty { padding:14px 4px; font-size:.875rem; color:#64748b; }
    .dark .todo-empty { color:#8A92A6; }
    .todo-chevron { transition:transform .2s; }
    #todoDoneToggle.is-open .todo-chevron { transform:rotate(180deg); }
    .todo-mic { flex:none; width:40px; height:40px; display:grid; place-content:center; border:0; border-radius:12px; background:none; color:#64748b; cursor:pointer; }
    .dark .todo-mic { color:#8A92A6; }
    .todo-mic:hover { color:#007E8A; }
    .todo-mic.is-listening { color:#fff; background:#e11d48; animation:micPulse 1.2s ease-in-out infinite; }
    @keyframes micPulse { 0%,100% { box-shadow:0 0 0 0 rgba(225,29,72,.45); } 50% { box-shadow:0 0 0 8px rgba(225,29,72,0); } }
    #todoAddInput:disabled { cursor:not-allowed; }
    /* 分站編輯模式（iPhone 式：晃動＋「−」） */
    .app-cell { position:relative; aspect-ratio:1; }
    .app-cell .app-tile { width:100%; height:100%; }
    #siteGrid.is-editing .app-tile { animation:appJiggle .32s ease-in-out infinite; animation-delay:var(--jiggle-delay,0s); }
    @keyframes appJiggle { 0%,100% { transform:rotate(-2deg); } 50% { transform:rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { #siteGrid.is-editing .app-tile { animation:none; } }
    .app-remove { position:absolute; top:-10px; left:-10px; width:36px; height:36px; display:grid; place-content:center; border:0; background:none; padding:0; cursor:pointer; z-index:2; }
    .app-remove span { width:22px; height:22px; border-radius:50%; background:#475569; box-shadow:0 1px 4px rgba(0,0,0,.35); display:grid; place-content:center; }
    .app-remove span::after { content:""; width:10px; height:2px; border-radius:2px; background:#fff; }
    .app-remove:hover span, .app-remove:focus-visible span { background:#e11d48; }
    .app-preview { width:52px; height:52px; flex:none; }
    .app-preview .app-logo, .app-preview .app-fallback { width:100%; height:100%; }
    .reorder-handle { display:none !important; flex:none; min-width:28px; min-height:36px; padding:4px; border:0; background:transparent; color:#8A92A6; cursor:grab; touch-action:none; font:20px/1 Arial; }
    .reorder-handle:active { cursor:grabbing; }
    .reorder-handle:focus-visible { outline:2px solid #007E8A; border-radius:6px; }
    #appsAdminHint { display:none !important; }
    @media (max-width:1023px) {
      #dashGrid > [data-widget="clock"] { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); align-items:center; padding:18px 16px; gap:12px; }
      .clock-main { min-width:0; }
      #clockTime { font-size:clamp(34px,9vw,48px); }
      #clockSec { font-size:14px; }
      #clockDate { font-size:11px; line-height:1.5; }
      #dashGrid .clock-weather { min-width:0; border-top:0; border-left:1px solid rgba(148,163,184,.25); padding-top:0; padding-left:12px; gap:6px; }
      #wxIcon { width:24px; height:24px; }
      .clock-weather > div:last-child > p:first-child { flex-wrap:wrap; gap:2px 6px; }
      #wxTemp { font-size:27px; }
      #wxDesc { font-size:12px; line-height:1.4; }
      #wxMeta { display:none; }
      #wxRefresh { margin-top:4px; padding:4px 6px; font-size:11px; }
    }
    .todo-row { cursor:grab; user-select:none; -webkit-user-select:none; }
    .todo-edit { user-select:text; -webkit-user-select:text; }
    .app-tile[draggable="true"] { cursor:grab; }
    .app-tile { -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
    @media (max-width: 1023px), (pointer: coarse) { .reorder-handle { display:none !important; } }
    .reorder-source { opacity:.3; }
    .todo-row.reorder-source { outline:1px dashed #007E8A; outline-offset:2px; border-radius:12px; }
    .reorder-floating { list-style:none; padding:6px 10px; border:1px solid rgba(0,126,138,.55); border-radius:14px; background:#fff; color:#0f172a; box-shadow:0 20px 45px rgba(0,0,0,.25),0 5px 14px rgba(0,0,0,.15); transform-origin:center; will-change:transform; }
    .dark .reorder-floating { background:#242a38; color:#f1f5f9; border-color:#00A3B4; box-shadow:0 22px 50px rgba(0,0,0,.65),0 0 0 1px rgba(0,163,180,.2); }
    .reorder-floating .reorder-handle, .reorder-floating .todo-del { visibility:hidden; }
    @media (prefers-reduced-motion: reduce) { .reorder-floating { will-change:auto; } }
    .reorder-target { outline:2px solid #00A3B4; outline-offset:3px; border-radius:8px; }
    .app-cell > .reorder-handle { position:absolute; right:-8px; bottom:18px; z-index:3; border-radius:8px; background:#161924; color:#fff; min-height:28px; }
  </style>

  <!-- 深淺主題預載防閃爍（與 YA 相同） -->
  <script>
    (function () {
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      function savedTheme() {
        const value = localStorage.getItem('theme');
        return value === 'light' || value === 'dark' ? value : null;
      }
      function applyTheme() {
        const chosen = savedTheme();
        document.documentElement.classList.toggle('dark', chosen ? chosen === 'dark' : systemTheme.matches);
      }
      applyTheme();
      function onSystemThemeChange() {
        if (!savedTheme()) applyTheme();
      }
      if (typeof systemTheme.addEventListener === 'function') {
        systemTheme.addEventListener('change', onSystemThemeChange);
      } else if (typeof systemTheme.addListener === 'function') {
        systemTheme.addListener(onSystemThemeChange);
      }
    })();
  </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-[#090A0F] dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-[#007E8A] selection:text-white">

  <header id="clc-header"></header>

  <main class="max-w-6xl w-full mx-auto px-5 sm:px-8 py-8 lg:py-12 flex-1 flex flex-col gap-6 lg:gap-8">

    <div id="dx-swipe-zone" class="space-y-1.5">
      <p class="text-xs lg:text-sm font-bold tracking-[0.3em] text-[#007E8A] dark:text-[#00A3B4] uppercase">CLC Control Panel</p>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white">Good Morning DX04</h1>
    </div>

    <!-- 手機：單欄，可拖曳排序（順序存在本機）；電腦：左待辦、右上分站、右下時間天氣 -->
    <div id="dashGrid" class="flex flex-col gap-6 lg:grid lg:grid-cols-[1.45fr_1fr] lg:grid-rows-[auto_1fr] lg:items-stretch">

      <!-- 時間、日期、天氣 -->
      <section data-widget="clock" aria-label="時間與天氣" class="dash-widget relative rounded-3xl bg-white dark:bg-[#161924] border border-slate-200 dark:border-white/10 p-5 sm:p-6 flex flex-col gap-5">
        <button type="button" class="drag-handle lg:hidden" aria-label="拖曳或用上下鍵調整順序"><span></span></button>
        <div class="clock-main">
          <p class="flex items-baseline gap-1 font-extrabold tracking-tight tabular-nums text-slate-900 dark:text-white"><span id="clockTime" class="text-5xl sm:text-6xl">--:--</span><span id="clockSec" class="text-2xl sm:text-3xl text-slate-400 dark:text-brand-muted">:--</span></p>
          <p id="clockDate" class="mt-1 text-base text-slate-500 dark:text-brand-muted">&nbsp;</p>
        </div>
        <div class="clock-weather border-t border-slate-100 dark:border-white/[0.06] pt-5 flex items-center gap-4">
          <div id="wxIcon" class="w-14 h-14 shrink-0 text-[#007E8A] dark:text-[#00A3B4]"></div>
          <div class="min-w-0 flex-1">
            <p class="flex items-baseline gap-2"><span id="wxTemp" class="text-3xl font-extrabold text-slate-900 dark:text-white tabular-nums">--°</span><span id="wxDesc" class="text-base text-slate-600 dark:text-slate-300">讀取天氣中…</span></p>
            <p id="wxMeta" class="mt-1 text-sm text-slate-500 dark:text-brand-muted">板橋</p>
            <button id="wxRefresh" type="button" hidden class="mt-2 rounded-lg border border-slate-300 dark:border-white/20 px-3 py-2 text-sm font-bold text-[#007E8A] dark:text-[#00A3B4] disabled:opacity-50" aria-label="重新讀取天氣">↻ 重新整理</button>
          </div>
        </div>
      </section>

      <!-- 今日待辦：存在 Firestore dx04_todos（僅 Superuser 可讀寫）；可文字或語音新增、勾選完成、刪除 -->
      <section data-widget="todo" aria-labelledby="todoTitle" class="dash-widget relative rounded-3xl bg-white dark:bg-[#161924] border border-slate-200 dark:border-white/10 p-5 sm:p-6 flex flex-col gap-3">
        <button type="button" class="drag-handle lg:hidden" aria-label="拖曳或用上下鍵調整順序"><span></span></button>
        <div class="flex items-center justify-between gap-3">
          <h2 id="todoTitle" class="text-xl font-extrabold text-slate-900 dark:text-white">今日待辦</h2>
          <p id="todoSummary" class="text-xs sm:text-sm text-slate-500 dark:text-brand-muted"></p>
        </div>

        <form id="todoAddForm" class="flex items-center gap-2 h-12 pl-4 pr-1.5 rounded-2xl bg-slate-100 dark:bg-white/[0.04] border border-slate-200 dark:border-white/10 focus-within:border-[#007E8A]">
          <label for="todoAddInput" class="sr-only">新增待辦</label>
          <input id="todoAddInput" type="text" autocomplete="off" enterkeyhint="done" maxlength="200" placeholder="新增待辦… 例如「明天下午3點 回覆新朋友 #SR」" class="flex-1 min-w-0 bg-transparent outline-none text-[15px] text-slate-800 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500">
          <button type="button" id="todoMicBtn" class="todo-mic hidden" aria-label="語音輸入" title="語音輸入">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
        </form>
        <p id="todoStatus" class="hidden text-sm text-slate-500 dark:text-brand-muted"></p>

        <div id="todoBody" class="flex flex-col gap-1"></div>

        <div class="mt-auto pt-2 border-t border-slate-100 dark:border-white/[0.06]">
          <button type="button" id="todoDoneToggle" class="w-full h-11 flex items-center justify-between text-sm text-slate-500 dark:text-brand-muted" aria-expanded="false" aria-controls="todoDoneList">
            <span>今天已完成 <span id="todoDoneCount">0</span> 項</span>
            <svg class="todo-chevron w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <ul id="todoDoneList" class="hidden"></ul>
        </div>
      </section>

      <!-- App 入口：4 欄 × 2 排，共 8 格 -->
      <section data-widget="apps" aria-labelledby="appsTitle" class="dash-widget relative space-y-3">
        <button type="button" class="drag-handle lg:hidden" aria-label="拖曳或用上下鍵調整順序"><span></span></button>
        <div class="flex items-center justify-between gap-3 min-h-[28px]">
          <h2 id="appsTitle" class="text-sm font-bold text-slate-500 dark:text-brand-muted">分站入口</h2>
          <button type="button" id="appsDoneBtn" class="hidden h-9 px-4 rounded-full text-sm font-bold bg-[#007E8A] hover:bg-[#006C77] text-white">完成</button>
        </div>
        <!-- 分站清單存在 Firestore dx04_settings/apps；管理員長按進入編輯模式：「−」移除、「＋」新增、點 Logo 編輯 -->
        <div id="siteGrid" class="grid grid-cols-4 gap-3"></div>
        <p id="appsAdminHint" class="hidden text-xs text-slate-400 dark:text-slate-500"></p>
      </section>
    </div>
  </main>

  <!-- 分站新增：只要貼網址（僅管理員） -->
  <dialog id="appAddDialog" class="app-dialog rounded-3xl p-0 w-[min(92vw,420px)] bg-white dark:bg-[#161924] text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-white/10">
    <form id="appAddForm" class="p-6 flex flex-col gap-4">
      <h2 class="text-xl font-extrabold text-slate-900 dark:text-white">新增分站</h2>

  <footer class="border-t border-slate-200 dark:border-white/10 py-3.5 text-center text-[10px] md:text-xs text-slate-500 dark:text-brand-muted">
