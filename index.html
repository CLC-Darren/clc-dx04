  <!-- 深淺主題預載防閃爍（與 YA 相同） -->
  <script>
    (function () {
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      function savedTheme() {
        const value = localStorage.getItem('theme');
        return value === 'light' || value === 'dark' ? value : null;
      }
      function applyTheme() {
        const chosen = savedTheme();
        document.documentElement.classList.toggle('dark', chosen ? chosen === 'dark' : systemTheme.matches);
      }
      applyTheme();
      function onSystemThemeChange() {
        if (!savedTheme()) applyTheme();
      }
      if (typeof systemTheme.addEventListener === 'function') {
        systemTheme.addEventListener('change', onSystemThemeChange);
      } else if (typeof systemTheme.addListener === 'function') {
        systemTheme.addListener(onSystemThemeChange);
      }
    })();
  </script>
  <!-- DX04 Welcome 動態歡迎畫面 v2（掛載於 html 根節點，不被 dx-locked 隱藏；電腦版橫向左進右出 / 手機版直向上進下出，無等待連續循環，點擊沿用 Google 登入） -->
  <style id="dx04-welcome-style">

  <script id="dx04-welcome-script">
    (function () {
      if (document.getElementById('dx04-welcome-overlay')) return;

      // 歡迎頁由實際登入權限決定，不以片頭播放紀錄判斷。
      // 直接掛載在 <html>（document.documentElement），繞過 html.dx-locked 對 <body> 的隱藏規則
      const overlay = document.createElement('div');
      overlay.id = 'dx04-welcome-overlay';
      overlay.setAttribute('role', 'button');
      overlay.setAttribute('tabindex', '0');
      overlay.setAttribute('aria-label', '點擊進入網站');

      const canvas = document.createElement('canvas');
      canvas.id = 'dx04-welcome-canvas';
      overlay.appendChild(canvas);
      document.documentElement.appendChild(overlay);

      const ctx = canvas.getContext('2d', { alpha: false });
      if (!ctx) { overlay.remove(); return; }

      const DURATION = 10.0;          // 單次完整動畫長度（秒）
      const PALETTE = {
        primary:   { r: 0,   g: 131, b: 139 }, // #00838B 深海青（主色）
        electric:  { r: 0,   g: 229, b: 255 }, // #00E5FF 電光青
        cobalt:    { r: 41,  g: 121, b: 255 }, // #2979FF 科技鈷藍
        mint:      { r: 167, g: 255, b: 235 }, // #A7FFEB 冰川薄荷
        white:     { r: 255, g: 255, b: 255 }  // #FFFFFF 純白還原
      };

      let W = 0, H = 0, dpr = 1;
      let isPortrait = false;
      let particles = [];
      let streamFilaments = [];
      let logoFontSpec = '';
      let logoText = 'DX04';
      let logoBaselineY = 0;
      let logoBitmap = null;

      let entered = false, entering = false;
      let startTime = performance.now();
      let rafId = 0;

      function clamp(v, min, max) { return v < min ? min : (v > max ? max : v); }
      function smoothstep(e0, e1, x) {
        const t = clamp((x - e0) / (e1 - e0), 0, 1);
        return t * t * (3 - 2 * t);
      }
      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function mixColor(c1, c2, t) {
        return {
          r: Math.round(lerp(c1.r, c2.r, t)),
          g: Math.round(lerp(c1.g, c2.g, t)),
          b: Math.round(lerp(c1.b, c2.b, t))
        };
      }

      // 離屏取樣純白粗體無襯線 DX04 像素，確保起點與終點 100% 精準對齊原圖
      function sampleLogoTargets() {
        if (W <= 0 || H <= 0) return false;
        const off = document.createElement('canvas');
        off.width = Math.round(W * dpr);
        off.height = Math.round(H * dpr);
        const octx = off.getContext('2d');
        if (!octx) return false;
        octx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // 與原登入頁一致：clamp(64px, 14vw, 112px)、Arial 粗體、.05em 字距。
        const fontSize = Math.max(64, Math.min(W * 0.14, 112));
        // 原底層的 CLC Arial 粗體對應 Arial Bold；Canvas 明確使用 700，避免 800 字重的替代字形。
        logoFontSpec = '700 ' + fontSize + 'px Arial, "Microsoft JhengHei", sans-serif';
        if ('letterSpacing' in octx) octx.letterSpacing = (fontSize * 0.05) + 'px';
        if ('letterSpacing' in ctx) ctx.letterSpacing = (fontSize * 0.05) + 'px';
        logoBaselineY = H * 0.5;

        octx.clearRect(0, 0, W, H);
        octx.fillStyle = '#FFFFFF';
        octx.font = logoFontSpec;
        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        octx.fillText(logoText, W * 0.5, logoBaselineY);
        logoBitmap = off;

        let imgData;
        try {
          imgData = octx.getImageData(0, 0, off.width, off.height).data;
        } catch (_) {
          return false;
        }

        const step = isPortrait
          ? Math.max(2, Math.round(Math.min(W, H) / 230))
          : Math.max(2, Math.round(Math.min(W, H) / 270));

        const pts = [];
        let minX = W, maxX = 0, minY = H, maxY = 0;

        for (let y = 0; y < H; y += step) {
          for (let x = 0; x < W; x += step) {
            const idx = (Math.round(y * dpr) * off.width + Math.round(x * dpr)) * 4;
            if (imgData[idx + 3] > 140) {
              pts.push({ x, y });
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }

        const spanX = Math.max(1, maxX - minX);
        const spanY = Math.max(1, maxY - minY);

        particles = pts.map((pt, i) => {
          const normX = (pt.x - minX) / spanX; // 0 (左) -> 1 (右)
          const normY = (pt.y - minY) / spanY; // 0 (上) -> 1 (下)
          const h1 = Math.sin(i * 12.9898 + pt.x * 0.07) * 43758.5453;
          const r1 = h1 - Math.floor(h1);
          const h2 = Math.sin(i * 78.233 + pt.y * 0.09) * 24634.6345;
          const r2 = h2 - Math.floor(h2);
          const h3 = Math.sin((i + 17) * 39.425) * 19283.421;
          const r3 = h3 - Math.floor(h3);

          // 三層非對稱氣動光帶分配
          const lane = r1 < 0.44 ? 0 : (r1 < 0.78 ? 1 : 2);
          let tone = PALETTE.primary;
          if (r2 > 0.86) tone = PALETTE.mint;
          else if (r2 > 0.56) tone = PALETTE.electric;
          else if (r2 > 0.30) tone = PALETTE.cobalt;

          return {
            tx: pt.x,
            ty: pt.y,
            normX,
            normY,
            lane,
            r1,
            r2,
            r3,
            tone,
            baseSize: Math.max(1.3, step * (0.52 + r3 * 0.34))
          };
        });

        // 背景細微氣氛流線（電腦版：左進右出；手機版：上進下出）
        const count = isPortrait ? 38 : 46;
        streamFilaments = Array.from({ length: count }, (_, idx) => {
          const t = idx / count;
          return {
            offset: (t - 0.5) * 0.78 + Math.sin(idx * 3.7) * 0.06,
            speed: 0.65 + (idx % 5) * 0.14,
            phase: idx * 1.37,
            len: 0.14 + (idx % 4) * 0.05,
            tone: idx % 3 === 0 ? PALETTE.electric : (idx % 3 === 1 ? PALETTE.primary : PALETTE.cobalt)
          };
        });
        return true;
      }

      function setupViewport(resetClock) {
        const rect = overlay.getBoundingClientRect();
        W = Math.round(rect.width) || window.innerWidth || document.documentElement.clientWidth || 0;
        H = Math.round(rect.height) || window.innerHeight || document.documentElement.clientHeight || 0;
        if (W <= 0 || H <= 0) return false;

        isPortrait = H > W; // 手機直向 vs 電腦橫向
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const ok = sampleLogoTargets();
        if (ok && resetClock) {
          startTime = performance.now();
        }
        return ok;
      }

      // 粒子取樣、動畫收斂與完整字樣共用同一張高解析透明底圖。
      function drawLogo(opacity = 1) {
        if (!logoBitmap) return;
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = clamp(opacity, 0, 1);
        ctx.drawImage(logoBitmap, 0, 0, W, H);
        ctx.restore();
      }
      function drawStaticLogo() {
        if (W <= 0 || H <= 0) return;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, W, H);
        drawLogo();
      }

      // 電腦版（橫向）：非對稱「左進右出」流體光帶
      function renderDesktopHorizontal(elapsed) {
        const leaveProgress = smoothstep(1.35, 3.65, elapsed);
        const returnProgress = smoothstep(6.25, 8.45, elapsed);
        const morphEnvelope = leaveProgress * (1 - returnProgress);
        const particleOpacity = smoothstep(1.35, 1.85, elapsed) * (1 - smoothstep(7.65, 8.45, elapsed));

        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, W, H);

        if (morphEnvelope <= 0.0001) {
          drawStaticLogo();
          return;
        }

        // 柔和深海青空間光暈（非對稱偏右側流動）
        const glowX = W * (0.46 + 0.14 * Math.sin(elapsed * 0.7));
        const glowY = H * (0.52 - 0.06 * Math.cos(elapsed * 0.6));
        const rad = Math.max(W, H) * 0.48;
        const grad = ctx.createRadialGradient(glowX, glowY, 0, glowX, glowY, rad);
        grad.addColorStop(0, 'rgba(0, 131, 139, ' + (0.20 * morphEnvelope).toFixed(4) + ')');
        grad.addColorStop(0.55, 'rgba(41, 121, 255, ' + (0.07 * morphEnvelope).toFixed(4) + ')');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // 繪製左進右出流體光絲
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < streamFilaments.length; i++) {
          const f = streamFilaments[i];
          const u0 = ((elapsed * 0.28 * f.speed + f.phase) % 1.35) - 0.2;
          const u1 = u0 + f.len;
          const x0 = u0 * W;
          const x1 = u1 * W;
          const wave0 = Math.sin(u0 * 5.2 + f.phase) * H * 0.075 - u0 * H * 0.14;
          const wave1 = Math.sin(u1 * 5.2 + f.phase) * H * 0.075 - u1 * H * 0.14;
          const baseY = H * (0.54 + f.offset * 0.65);

          const alpha = 0.22 * morphEnvelope * Math.sin(clamp(u0, 0, 1) * Math.PI);
          if (alpha <= 0.004) continue;

          ctx.strokeStyle = 'rgba(' + f.tone.r + ',' + f.tone.g + ',' + f.tone.b + ',' + alpha.toFixed(4) + ')';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(x0, baseY + wave0);
          ctx.lineTo(x1, baseY + wave1);
          ctx.stroke();
        }

        // 粒子計算（由左至右依序剝離，向右上方流出，再由左側匯入定格）
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const stagger = p.normX * 0.55 + p.r1 * 0.18;
          const outT = easeInOutCubic(smoothstep(1.35 + stagger * 0.85, 3.35 + stagger * 0.85, elapsed));
          const inT  = easeInOutCubic(smoothstep(6.05 + stagger * 0.85, 8.15 + stagger * 0.85, elapsed));
          const active = outT * (1 - inT);

          let x = p.tx;
          let y = p.ty;
          let col = PALETTE.white;
          let alpha = 1;
          let size = p.baseSize;

          if (active > 0.0005) {
            const drift = (elapsed - 1.35) * (0.24 + p.r2 * 0.13) + p.normX * 0.42 + p.r3 * 0.25;
            const wrapU = ((drift % 1.36) + 1.36) % 1.36 - 0.18; // -0.18（左側入口）到 1.18（右側出口）
            const streamX = wrapU * W;

            const laneShift = (p.lane - 1) * H * 0.095;
            const harmonic = Math.sin(wrapU * 5.6 + p.lane * 1.4 + elapsed * 1.9) * H * (0.065 + p.r2 * 0.035);
            const upwardTilt = (0.5 - wrapU) * H * 0.22; // 左低右高非對稱斜向氣流
            const streamY = H * 0.5 + laneShift + harmonic + upwardTilt + (p.normY - 0.5) * H * 0.08;

            const targetStreamX = inT > 0.05 ? lerp(streamX, p.tx - W * 0.18, inT) : streamX;

            x = lerp(p.tx, targetStreamX, active);
            y = lerp(p.ty, streamY, active);

            const colorBlend = smoothstep(0.05, 0.45, active);
            const primaryMix = mixColor(PALETTE.primary, p.tone, 0.35 + 0.65 * Math.sin(wrapU * Math.PI));
            col = mixColor(PALETTE.white, primaryMix, colorBlend);

            const edgeFade = smoothstep(-0.18, -0.02, wrapU) * (1 - smoothstep(1.02, 1.18, wrapU));
            alpha = lerp(1, 0.35 + 0.65 * edgeFade, active);
            size = p.baseSize * (1 + 0.45 * active * (0.5 + 0.5 * p.r3));
          }

          ctx.fillStyle = 'rgba(' + col.r + ',' + col.g + ',' + col.b + ',' + (alpha * particleOpacity).toFixed(3) + ')';
          ctx.fillRect(x - size * 0.5, y - size * 0.5, size, size);
        }

        drawLogo(1 - particleOpacity);
      }

      // 手機版（直向）：非對稱「上進下出」垂直流體光帶
      function renderMobileVertical(elapsed) {
        const leaveProgress = smoothstep(1.35, 3.65, elapsed);
        const returnProgress = smoothstep(6.25, 8.45, elapsed);
        const morphEnvelope = leaveProgress * (1 - returnProgress);
        const particleOpacity = smoothstep(1.35, 1.85, elapsed) * (1 - smoothstep(7.65, 8.45, elapsed));

        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, W, H);

        if (morphEnvelope <= 0.0001) {
          drawStaticLogo();
          return;
        }

        // 柔和深海青垂直空間光暈
        const glowX = W * (0.52 + 0.08 * Math.sin(elapsed * 0.65));
        const glowY = H * (0.48 + 0.14 * Math.sin(elapsed * 0.7));
        const rad = Math.max(W, H) * 0.46;
        const grad = ctx.createRadialGradient(glowX, glowY, 0, glowX, glowY, rad);
        grad.addColorStop(0, 'rgba(0, 131, 139, ' + (0.22 * morphEnvelope).toFixed(4) + ')');
        grad.addColorStop(0.55, 'rgba(41, 121, 255, ' + (0.08 * morphEnvelope).toFixed(4) + ')');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // 繪製上進下出垂直流體光絲
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < streamFilaments.length; i++) {
          const f = streamFilaments[i];
          const v0 = ((elapsed * 0.27 * f.speed + f.phase) % 1.35) - 0.2;
          const v1 = v0 + f.len;
          const y0 = v0 * H;
          const y1 = v1 * H;
          const wave0 = Math.sin(v0 * 5.4 + f.phase) * W * 0.085 + (v0 - 0.5) * W * 0.18;
          const wave1 = Math.sin(v1 * 5.4 + f.phase) * W * 0.085 + (v1 - 0.5) * W * 0.18;
          const baseX = W * (0.5 + f.offset * 0.68);

          const alpha = 0.22 * morphEnvelope * Math.sin(clamp(v0, 0, 1) * Math.PI);
          if (alpha <= 0.004) continue;

          ctx.strokeStyle = 'rgba(' + f.tone.r + ',' + f.tone.g + ',' + f.tone.b + ',' + alpha.toFixed(4) + ')';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(baseX + wave0, y0);
          ctx.lineTo(baseX + wave1, y1);
          ctx.stroke();
        }

        // 粒子計算（由上至下依序剝離，向下方斜向流出，再由上方匯入定格）
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const stagger = p.normY * 0.55 + p.r1 * 0.18;
          const outT = easeInOutCubic(smoothstep(1.35 + stagger * 0.85, 3.35 + stagger * 0.85, elapsed));
          const inT  = easeInOutCubic(smoothstep(6.05 + stagger * 0.85, 8.15 + stagger * 0.85, elapsed));
          const active = outT * (1 - inT);

          let x = p.tx;
          let y = p.ty;
          let col = PALETTE.white;
          let alpha = 1;
          let size = p.baseSize;

          if (active > 0.0005) {
            const drift = (elapsed - 1.35) * (0.24 + p.r2 * 0.13) + p.normY * 0.42 + p.r3 * 0.25;
            const wrapV = ((drift % 1.36) + 1.36) % 1.36 - 0.18; // -0.18（上方入口）到 1.18（下方出口）
            const streamY = wrapV * H;

            const laneShift = (p.lane - 1) * W * 0.11;
            const harmonic = Math.sin(wrapV * 5.8 + p.lane * 1.4 + elapsed * 1.9) * W * (0.075 + p.r2 * 0.04);
            const diagonalTilt = (wrapV - 0.5) * W * 0.24; // 上偏左、下偏右非對稱垂直 S 型氣流
            const streamX = W * 0.5 + laneShift + harmonic + diagonalTilt + (p.normX - 0.5) * W * 0.10;

            const targetStreamY = inT > 0.05 ? lerp(streamY, p.ty - H * 0.18, inT) : streamY;

            x = lerp(p.tx, streamX, active);
            y = lerp(p.ty, targetStreamY, active);

            const colorBlend = smoothstep(0.05, 0.45, active);
            const primaryMix = mixColor(PALETTE.primary, p.tone, 0.35 + 0.65 * Math.sin(wrapV * Math.PI));
            col = mixColor(PALETTE.white, primaryMix, colorBlend);

            const edgeFade = smoothstep(-0.18, -0.02, wrapV) * (1 - smoothstep(1.02, 1.18, wrapV));
            alpha = lerp(1, 0.35 + 0.65 * edgeFade, active);
            size = p.baseSize * (1 + 0.45 * active * (0.5 + 0.5 * p.r3));
          }

          ctx.fillStyle = 'rgba(' + col.r + ',' + col.g + ',' + col.b + ',' + (alpha * particleOpacity).toFixed(3) + ')';
          ctx.fillRect(x - size * 0.5, y - size * 0.5, size, size);
        }

        drawLogo(1 - particleOpacity);
      }

      function loop(now) {
        if (entered) return;
        if (W <= 0 || H <= 0) {
          if (setupViewport(true)) {
            drawStaticLogo();
          }
          rafId = requestAnimationFrame(loop);
          return;
        }

        // 每輪動畫 10 秒，結尾停留 1 秒後重播。
        const REPLAY_GAP_SECONDS = 1;
        const cycleDuration = DURATION + REPLAY_GAP_SECONDS;
        const phase = (((now - startTime) / 1000) % cycleDuration + cycleDuration) % cycleDuration;
        const elapsed = 1.35 + (Math.min(phase, DURATION) / DURATION) * (8.45 - 1.35);

        if (isPortrait) {
          renderMobileVertical(elapsed);
        } else {
          renderDesktopHorizontal(elapsed);
        }

        rafId = requestAnimationFrame(loop);
      }

      // 點擊或按鍵登入成功後，立即停止歡迎動畫
      async function enterSite(e) {
        if (entered || entering) return;
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        if (typeof window.clcEnterWelcome !== 'function') return;
        entering = true;
        const authorized = await window.clcEnterWelcome();
        entering = false;
        if (!authorized) return;
        dismissWelcome(false);
      }

      function dismissWelcome(immediate) {
        if (entered) return;
        entered = true;
        cancelAnimationFrame(rafId);
        window.removeEventListener('resize', onResize);
        if (immediate) { overlay.remove(); return; }
        overlay.classList.add('is-leaving');
        setTimeout(() => {
          if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 460);
      }

      window.clcDismissWelcome = () => dismissWelcome(true);

      function onResize() {
        if (entered) return;
        setupViewport(false);
        drawStaticLogo();
      }

      overlay.addEventListener('touchstart', e => e.stopPropagation(), { passive:true });
      overlay.addEventListener('touchmove', e => e.stopPropagation(), { passive:true });
      overlay.addEventListener('click', enterSite);
      overlay.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') enterSite(e);
      });
      window.addEventListener('resize', onResize);
      document.addEventListener('DOMContentLoaded', () => {
        document.fonts.ready.then(() => { if (!entered) setupViewport(false); });
      }, { once:true });

      if (setupViewport(true)) {
        drawStaticLogo();
      }
      rafId = requestAnimationFrame(loop);
    })();
  </script>

<body class="bg-slate-50 text-slate-800 dark:bg-[#090A0F] dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-[#007E8A] selection:text-white">

  <header id="clc-header"></header>

  <main id="dx-main" class="w-full py-8 lg:py-12 flex-1 flex flex-col gap-6 lg:gap-8">

    <div class="dx-top">
    <div id="dx-swipe-zone" class="space-y-1.5">
      <p class="text-xs lg:text-sm font-bold tracking-[0.3em] text-[#007E8A] dark:text-[#00A3B4] uppercase">CLC Control Panel</p>
      <h1 id="dx-greeting" class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white">Hello, DX04</h1>
      <script>
        // 依時段隨機挑一句問候語；{n} 換成登入者名字（未登入或「以未登入身份檢視」時顯示 DX04）。
        // 想換句子直接改下面清單即可，每段放幾句都行。
        (function () {
          const POOLS = {
            early: [ // 05:00–07:59
              "You're up early, {n}", "Early bird, huh, {n}?", "Up before the sun, {n}?",
              "Up and at 'em, {n}", "Morning, {n}. Quiet start to the day"
            ],
            morning: [ // 08:00–11:59
              "Good morning, {n}", "Morning, {n}! Coffee first?", "Rise and shine, {n}",
              "Morning, {n}. What's on deck today?", "Hey {n}, ready to roll?", "Fresh start, {n}. Let's go"
            ],
            lunch: [ // 12:00–13:59
              "Lunchtime, {n}", "Have you eaten yet, {n}?", "Time to refuel, {n}",
              "Afternoon, {n}. Lunch first?", "Take a break, {n}. You've earned it"
            ],
            afternoon: [ // 14:00–17:59
              "Good afternoon, {n}", "Hey {n}, how's the day going?", "Afternoon, {n}. Keep it rolling",
              "Coffee break, {n}?", "Home stretch, {n}", "Still going strong, {n}?"
            ],
            evening: [ // 18:00–21:59
              "Good evening, {n}", "Evening, {n}. Long day?", "Nice work today, {n}",
              "Had dinner yet, {n}?", "Time to wind down, {n}?", "Evening, {n}. Take it easy"
            ],
            late: [ // 22:00–00:59
              "Working late, {n}?", "Still at it, {n}?", "Burning the midnight oil, {n}?",
              "Wrapping up soon, {n}?", "Long night, {n}?", "Don't stay up too late, {n}"
            ],
            night: [ // 01:00–04:59
              "Still up, {n}?", "Still working late, {n}?", "Can't sleep, {n}?",
              "Hey there, night owl", "Shouldn't you be in bed, {n}?", "It's late, {n}. Get some rest soon"
            ]
          };
          // 特定日子額外加入的句子（和原本的混在一起抽）
          const EXTRA = {
            weekendMorning: ["Happy {d}, {n}", "Enjoy your {d}, {n}"],
            mondayMorning: ["Happy Monday, {n}", "New week, {n}. Let's do this"],
            fridayAfternoon: ["Almost the weekend, {n}", "TGIF, {n}!"],
            sundayEvening: ["Ready for the week, {n}?"]
          };
          const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
          function slotOf(h) {
            if (h >= 5 && h < 8) return 'early';
            if (h >= 8 && h < 12) return 'morning';
            if (h >= 12 && h < 14) return 'lunch';
            if (h >= 14 && h < 18) return 'afternoon';
            if (h >= 18 && h < 22) return 'evening';
            if (h >= 22 || h < 1) return 'late';
            return 'night';
          }
          function poolFor(now) {
            const slot = slotOf(now.getHours()), day = now.getDay();
            let list = POOLS[slot].slice();
            if ((slot === 'early' || slot === 'morning') && (day === 0 || day === 6)) list = list.concat(EXTRA.weekendMorning);
            if ((slot === 'early' || slot === 'morning') && day === 1) list = list.concat(EXTRA.mondayMorning);
            if ((slot === 'lunch' || slot === 'afternoon') && day === 5) list = list.concat(EXTRA.fridayAfternoon);
            if (slot === 'evening' && day === 0) list = list.concat(EXTRA.sundayEvening);
            return { key: slot + day, list: list, dayName: DAYS[day] };
          }
          function userName() {
            const u = window.auth && window.auth.currentUser;
            if (!u || window.clcGuestView) return 'DX04';
            const n = (u.displayName || '').trim().split(/\s+/)[0];
            return n || 'DX04';
          }
          const el = document.getElementById('dx-greeting');
          let curKey = '', curLine = '';
          function render(force) {
            const p = poolFor(new Date());
            if (force || p.key !== curKey) { // 進入新時段才重抽，同一時段內不會一直跳
              curKey = p.key;
              curLine = p.list[Math.floor(Math.random() * p.list.length)].replace('{d}', p.dayName);
            }
            const text = curLine.replace('{n}', userName());
            if (el && el.textContent !== text) { el.textContent = text; fitGreeting(); }
          }
          // 手機：問候語超過一行就縮小字（同 LF）
          const greetMq = matchMedia('(max-width:639px)');
          function fitGreeting() {
            if (!el) return;
            el.style.removeProperty('--dx-greeting-size');
            if (!greetMq.matches) return;
            const available = el.clientWidth, required = el.scrollWidth;
            if (available > 0 && required > available) el.style.setProperty('--dx-greeting-size', Math.max(14, parseFloat(getComputedStyle(el).fontSize) * (available - 1) / required) + 'px');
          }
          if (el) new ResizeObserver(fitGreeting).observe(el.parentElement);
          greetMq.addEventListener('change', fitGreeting);
          document.fonts.ready.then(fitGreeting);
          render(true);
          setInterval(function () { render(false); }, 60000);
          window.addEventListener('clc-admin-changed', function () { render(false); });
          document.addEventListener('visibilitychange', function () { if (!document.hidden) render(false); });
          (function hook(tries) {
            if (window.auth && window.auth.onAuthStateChanged) window.auth.onAuthStateChanged(function () { render(false); });
            else if (tries < 50) setTimeout(function () { hook(tries + 1); }, 200);
          })(0);
        })();
      </script>

  <script type="text/plain" data-dx-private>

    // 時鐘與日期（台北時間）：以 Cloudflare 伺服器時間校正，不受本機時鐘誤差影響
    (function () {
      const clocks = [];
      function paintTime(clock, now) {
        const parts = Object.fromEntries(fmtTime.formatToParts(now).map(p => [p.type, p.value]));
        clock.clockTime.textContent = parts.hour + ':' + parts.minute;
        clock.clockSec.textContent = ':' + parts.second;
        clock.clockDate.textContent = fmtDate.format(now);
      }
      const tz = 'Asia/Taipei';
      const fmtTime = new Intl.DateTimeFormat('zh-TW', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
      const fmtDate = new Intl.DateTimeFormat('zh-TW', { timeZone: tz, year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      let offset = 0; // 伺服器時間 − 本機時間（毫秒）
      async function syncTime() {
        try {
          const t0 = Date.now();
          const res = await fetch('/favicon.svg?t=' + t0, { method: 'HEAD', cache: 'no-store' });
          const t1 = Date.now();
          const server = Date.parse(res.headers.get('date'));
          if (!isNaN(server)) offset = server + 500 - (t0 + t1) / 2; // Date 只到秒，補半秒
        } catch (_) { /* 連不到時沿用本機時間 */ }
      }
      function tick() {
        const now = new Date(Date.now() + offset);
        for (const clock of clocks) paintTime(clock, now);
        setTimeout(tick, 1000 - (now.getTime() % 1000) + 5);
      }

      // 天氣：Open-Meteo（免金鑰），位置為板橋，每 30 分鐘更新。
      const LAT = 25.0143, LON = 121.4672, PLACE = '板橋';
      const icons = {
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
        partly: '<path d="M8 3v1.5M3.5 8H2M4.8 4.8l1 1M12.5 5.5A4 4 0 0 0 5 8.5"/><path d="M8 20h9a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 8 20z"/>',
        cloud: '<path d="M7 19h10a4.5 4.5 0 0 0 .6-9 6 6 0 0 0-11.6 1.7A3.7 3.7 0 0 0 7 19z"/>',
        fog: '<path d="M7 14h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 14zM4 18h16M7 21h10"/>',
        rain: '<path d="M7 15h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 15zM8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
        storm: '<path d="M7 14h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 14zM12 15l-2 4h4l-2 4"/>'
      };
      function describe(code) {
        if (code === 0) return ['晴', 'sun'];
        if (code <= 2) return ['晴時多雲', 'partly'];
        if (code === 3) return ['陰', 'cloud'];
        if (code <= 48) return ['有霧', 'fog'];
        if (code <= 57) return ['毛毛雨', 'rain'];
        if (code <= 67) return ['雨', 'rain'];
        if (code <= 77) return ['雪', 'cloud'];
        if (code <= 82) return ['陣雨', 'rain'];
        return ['雷雨', 'storm'];
      }
      let loading = false, retryTimer = null;
      let weather = { description: '讀取天氣中…', temperature: '--°', failed: false };
      function paintWeather(clock) {
        const { wxIcon, wxTemp, wxDesc, wxMeta, wxRefresh } = clock;
        if (weather.icon) wxIcon.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full" aria-hidden="true">' + icons[weather.icon] + '</svg>';
        wxTemp.textContent = weather.temperature;
        wxDesc.textContent = weather.description;
        wxMeta.textContent = '';
        const lines = [PLACE, weather.range, weather.details].filter(Boolean);
        for (const [index, text] of lines.entries()) {
          const line = document.createElement('span');
          line.className = 'clock-weather-detail';
          line.textContent = text;
          if (index) {
            const separator = document.createElement('span');
            separator.className = 'clock-weather-separator';
            separator.textContent = ' · ';
            wxMeta.append(separator);
          }
          wxMeta.append(line);
        }
        wxRefresh.hidden = !weather.failed;
        wxRefresh.disabled = loading;
        wxRefresh.textContent = loading ? '讀取中…' : '↻ 重新整理';
      }
      async function load() {
        if (loading) return;
        loading = true;
        clearTimeout(retryTimer);
        clocks.forEach(paintWeather);
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
          '&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m' +
          '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=1&timezone=Asia%2FTaipei';
        try {
          const res = await fetch(url, { signal: controller.signal });
          if (!res.ok) throw new Error(res.status);
          const d = await res.json();
          const c = d.current, day = d.daily;
          const [text, icon] = describe(c.weather_code);
          weather = {
            icon, description: text, failed: false, temperature: Math.round(c.temperature_2m) + '°',
            range: '高 ' + Math.round(day.temperature_2m_max[0]) + '°　低 ' + Math.round(day.temperature_2m_min[0]) + '°',
            details: '降雨 ' + (day.precipitation_probability_max[0] ?? 0) + '% · 濕度 ' + c.relative_humidity_2m + '%'
          };
        } catch (err) {
          console.warn('天氣讀取失敗', err);
          weather = { ...weather, icon: 'cloud', description: '天氣暫時無法讀取', failed: true };
          retryTimer = setTimeout(load, 2 * 60 * 1000);
        } finally {
          clearTimeout(timeout);
          loading = false;
          clocks.forEach(paintWeather);
        }
      }
      // 桌面上的時鐘天氣卡片（可放好幾張）；回傳移除函式
      window.dxMountClock = widget => {
        const fields = ['clockTime', 'clockSec', 'clockDate', 'wxIcon', 'wxTemp', 'wxDesc', 'wxMeta', 'wxRefresh'];
        const clock = Object.fromEntries(fields.map(id => [id, widget.querySelector('[data-widget-field="' + id + '"]')]));
        clocks.push(clock);
        clock.wxRefresh.addEventListener('click', load);
        paintTime(clock, new Date(Date.now() + offset));
        paintWeather(clock);
        return () => { const i = clocks.indexOf(clock); if (i >= 0) clocks.splice(i, 1); };
      };
      tick();
      syncTime();
      load();
      setInterval(syncTime, 10 * 60 * 1000);
      setInterval(load, 30 * 60 * 1000);
    })();

  </script>

  <script type="text/plain" data-dx-private>
  (() => {
    // ---------- 共用桌面（shared/desktop）＋工具列（shared/toolbar） ----------
    // App 每個一格（清單仍在 dx04_settings/apps，所有人共用）；時鐘天氣、待辦是可調大小的卡片（最小 2×2）。
    // 每人一份：users/{uid}/desktop/home（有哪些卡片）、desktop / phone（排列，手機電腦各一份）。
    // 第一次打開會把舊的 DX 區塊（瀏覽器 localStorage）轉成新桌面，轉換前先備份到 users/{uid}/desktop_backups。
    const $id = id => document.getElementById(id);
    const deskRoot = $id('dxDesk');
    const isAdmin = () => !!window.isSuperuser;
    const CARD_TYPES = {
      clock: { label: '時鐘與天氣', w: 4, h: 2, minW: 4, minH: 1, maxW: 5, maxH: 2 }, // 只有 4×1、5×1、4×2、5×2 四種
      todo: { label: '代辦事項', w: 4, h: 4, minW: 4, minH: 2 }
    };
    const LEGACY_KEY = 'clc_dx04_dashboard_widgets_v1';
    let uid = '', cards = [], cardsLoaded = false, migrating = false, pendingAreas = [];
    const mounted = new Map(); // 卡片 id → { el, dispose }
    const appApi = {}; // App 區塊（下面）提供：name、openAdd、openEdit、remove
    const ts = () => firebase.firestore.FieldValue.serverTimestamp();
    const userDoc = () => window.db.collection('users').doc(uid);
    const deskRef = name => userDoc().collection('desktop').doc(name);
    function notice(msg) { const p = $id('dxNotice'); p.textContent = msg || ''; p.hidden = !msg; }
    function errText(err) {
      return err && err.code === 'permission-denied'
        ? '權限不足：請到 Firebase Console 發布最新的 firestore.rules（含 users/{uid}）。' : '請稍後再試。';
    }

    const cardOf = id => cards.find(c => c.id === id);
    const cardName = c => (c && (c.title || (c.id === 'todo' ? '代辦事項' : CARD_TYPES[c.type]?.label))) || '這張卡片';
    function addItems(cell) {
      if (!isAdmin()) return [];
      const list = [
        { label: '新增 APP', run: () => appApi.openAdd(cell) },
        { label: '新增代辦事項區域', run: () => addCard('todo', cell) },
        { label: '新增時鐘與天氣', run: () => addCard('clock', cell) }
      ];
      cards.filter(c => c.hidden && CARD_TYPES[c.type]).forEach(c => list.push({ label: '復原「' + cardName(c) + '」', run: () => showCard(c.id, cell) }));
      return list;
    }
    const desk = window.clcDesktop(deskRoot, {
      cols: { desktop: 16, phone: 4 }, cell: { desktop: 104, phone: 88 }, ratio: 1.3, margin: { desktop: 11, phone: 8 },
      waitLayout: true,
      canEdit: isAdmin,
      label: id => appApi.name?.(id) || cardName(cardOf(id)),
      menu: ({ id, type, cell }) => {
        if (!isAdmin()) return [];
        const m = [];
        if (type === 'app') m.push({ label: '編輯 App', run: () => appApi.openEdit(id) });
        if (type === 'card' && cardOf(id)?.type === 'todo') m.push({ label: '重新命名', run: () => renameCard(id) });
        return m.concat(addItems(cell), id ? [] : [{ label: '往上整理', run: () => desk.compact() }]); // 點空白處：排太長時把空列往上補齊
      },
      onDelete: (id, type) => type === 'card' ? hideCard(id) : appApi.remove(id),
      saveLayout: (mode, map) => {
        if (!uid) return;
        try { localStorage.setItem(layoutKey(mode), JSON.stringify(map)); } catch (_) {}
        return deskRef(mode).set({ layout: map, updatedAt: ts() });
      },
      error: err => notice('桌面排列儲存失敗：' + errText(err))
    });
    window.dxDesk = desk;
    const layoutKey = mode => 'dx_layout_' + mode + '_' + uid;
    // 開頁面時（還沒登入完成）先用上次登入者存在這台裝置的排列，loading 畫面就是最新排列，不會進去再跳一下
    try { const u = localStorage.getItem('dx_last_uid'); if (u) ['desktop', 'phone'].forEach(m => { const c = JSON.parse(localStorage.getItem('dx_layout_' + m + '_' + u) || 'null'); if (c) desk.setLayout(m, c); }); } catch (_) {}

    // 工具列：Home / Utility（Utility 先空白）
    const tb = window.clcToolbar($id('dxToolbar'), {
      tabs: [{ id: 'home', label: 'Home' }, { id: 'utility', label: 'Utility' }],
      active: 'home', placeholder: '搜尋 App 或卡片內容…', searchHost: $id('dxSearchHost'),
      onTab: t => {
        $id('dxHome').hidden = t !== 'home';
        $id('dxUtility').hidden = t !== 'utility';
        if (t === 'home') requestAnimationFrame(() => desk.relayout());
      },
      addItems: t => t === 'home' ? addItems(null) : [],
      onSearch: () => runSearch(),
      onEnter: () => {
        const id = runSearch().find(x => !cardOf(x));
        const a = id && desk.element(id)?.querySelector('a[href]');
        if (a) a.click();
      }
    });
    function runSearch() {
      const q = tb.value();
      if (q && tb.tab() !== 'home') tb.setTab('home');
      const hits = desk.search(q);
      $id('dxNoResult').hidden = !q || hits.length > 0;
      return hits;
    }
    window.dxRefreshSearch = () => { if (tb.value()) runSearch(); };
    window.addEventListener('clc-admin-changed', () => tb.refresh());

    // ---------- 卡片：時鐘天氣、今日待辦（沿用 DX 原本的待辦程式，第三階段才換共用 widget） ----------
    let mountTodo = null;
    window.clcMountTodos({
      find: (widget, id) => widget.querySelector('[data-todo-field="' + id + '"]') || widget.querySelector('#' + id),
      register: (_, init) => { mountTodo = init; },
      // 雲端有待辦、但桌面上還沒有那個待辦區域 → 補上（同舊版）
      discoverTodoAreas: discover
    });
    function discover(ids) {
      if (!cardsLoaded) { pendingAreas.push(...ids); return; }
      const add = ids.filter(id => !cardOf(id));
      if (!add.length) return;
      cards = cards.concat(add.map(id => ({ id, type: 'todo', title: '代辦事項' })));
      syncCards(); saveCards();
    }
    function cardEl(c) {
      const el = document.createElement('section');
      el.className = 'dx-card dash-widget';
      el.dataset.widget = c.type;
      el.dataset.widgetId = c.id;
      const grip = document.createElement('div'); // 電腦版上方小橫槓：按住可移動（手機不顯示，手機用長按）
      grip.className = 'dx-grip dk-handle';
      grip.title = '拖曳移動';
      el.append(grip);
      if (c.type === 'clock') {
        el.classList.add('dx-clock');
        el.setAttribute('aria-label', '時間與天氣');
        const body = $id('dxClockTpl').content.cloneNode(true);
        body.querySelectorAll('[id]').forEach(n => { n.dataset.widgetField = n.id; n.removeAttribute('id'); });
        el.append(body);
        el.querySelector('.clock-main').classList.add('dk-handle');
      } else {
        el.append(window.clcBuildTodoFields(c.id === 'todo' ? undefined : c.id));
        const h = el.querySelector('h2');
        h.textContent = cardName(c);
        h.classList.add('dk-handle');
        window.clcTodoTitleEdit(h, { canEdit: isAdmin, save: t => setCardTitle(c.id, t) });
        el.setAttribute('aria-labelledby', h.id);
      }
      return el;
    }
    function syncCards() {
      for (const [id, m] of mounted) {
        if (cards.some(c => c.id === id && !c.hidden)) continue;
        try { m.dispose?.(); } catch (_) {}
        desk.drop(id); mounted.delete(id);
      }
      for (const c of cards) {
        if (c.hidden || !CARD_TYPES[c.type]) continue;
        const m = mounted.get(c.id);
        if (m) { const h = m.el.querySelector('h2'); if (c.type === 'todo' && !h.isContentEditable) h.textContent = cardName(c); continue; }
        const el = cardEl(c), t = CARD_TYPES[c.type];
        desk.put(c.id, el, { type: 'card', w: t.w, h: t.h, minW: t.minW, minH: t.minH, maxW: t.maxW, maxH: t.maxH,
          searchText: () => el.textContent + ' ' + Array.from(el.querySelectorAll('textarea,input'), x => x.value).join(' ') });
        const dispose = c.type === 'clock' ? window.dxMountClock(el) : mountTodo?.(el, c.id);
        mounted.set(c.id, { el, dispose });
      }
      tb.refresh();
    }
    function saveCards() {
      if (!uid || !cardsLoaded) return;
      deskRef('home').set({ cards, updatedAt: ts() }, { merge: true }).catch(err => notice('卡片儲存失敗：' + errText(err)));
    }
    function addCard(type, cell) {
      const id = type === 'todo' ? 'area-' + crypto.randomUUID() : 'clock-' + crypto.randomUUID();
      if (cell) desk.placeNext(cell);
      cards = cards.concat({ id, type, title: type === 'todo' ? '代辦事項' : '' });
      syncCards(); saveCards();
      if (type === 'todo') requestAnimationFrame(() => mounted.get(id)?.el.querySelector('textarea')?.focus({ preventScroll: true }));
    }
    // 刪除＝收起來（待辦資料留著），選單可「復原」（同舊版）
    function hideCard(id) { cards = cards.map(c => c.id === id ? { ...c, hidden: true } : c); syncCards(); saveCards(); }
    function showCard(id, cell) { if (cell) desk.placeNext(cell); cards = cards.map(c => c.id === id ? { ...c, hidden: false } : c); syncCards(); saveCards(); }
    function renameCard(id) {
      const c = cardOf(id); if (!c) return;
      const t = prompt('區域名稱', cardName(c));
      if (t === null || !t.trim()) return;
      setCardTitle(id, t);
    }
    function setCardTitle(id, t) {
      cards = cards.map(x => x.id === id ? { ...x, title: t.trim().slice(0, 30) } : x);
      syncCards(); saveCards();
    }

    // ---------- 舊 DX 區塊 → 新桌面（轉換前先備份到 Firebase） ----------
    function legacyData() { try { return JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null'); } catch (_) { return null; } }
    function legacyCards(w) {
      const list = Array.isArray(w?.widgets) ? w.widgets : [{ id: 'clock', type: 'clock' }, { id: 'todo', type: 'todo' }];
      const out = list.filter(x => x && x.id && CARD_TYPES[x.type])
        .map(x => ({ id: String(x.id), type: x.type, title: String(x.title || '').slice(0, 30), hidden: !!x.hidden }));
      if (!out.some(c => c.type === 'clock')) out.unshift({ id: 'clock', type: 'clock', title: '' });
      if (!out.some(c => c.id === 'todo')) out.push({ id: 'todo', type: 'todo', title: '' });
      return out;
    }
    // 卡片依舊版電腦排列的順序（上到下、左到右）放在上面；App 自動補進其他空格
    function legacyLayout(list, w) {
      const old = w?.layout?.desktop || {}, cols = Math.max(6, Math.floor((deskRoot.clientWidth || 1040) / 104));
      const at = (id, k) => old[id]?.[k] ?? 99;
      const map = {}; let x = 0, y = 0, rowH = 0;
      list.filter(c => !c.hidden).sort((a, b) => (at(a.id, 'y') - at(b.id, 'y')) || (at(a.id, 'x') - at(b.id, 'x'))).forEach(c => {
        const t = CARD_TYPES[c.type];
        if (x + t.w > cols) { x = 0; y += rowH; rowH = 0; }
        map[c.id] = { x, y, w: t.w, h: t.h }; x += t.w; rowH = Math.max(rowH, t.h);
      });
      return map;
    }
    async function backupLegacy(w, note) {
      let apps = [];
      try { const s = await window.db.collection('dx04_settings').doc('apps').get(); apps = s.exists ? s.data().items || [] : []; } catch (_) {}
      if (JSON.stringify(apps).length > 700000) apps = apps.map(a => /^data:/.test(a.icon || '') ? { ...a, icon: '' } : a); // 避免超過 Firestore 1MB
      const ref = await userDoc().collection('desktop_backups').add({
        source: 'dx-dashboard-v1', note, device: navigator.userAgent.slice(0, 200),
        widgets: w ? JSON.stringify(w) : '',
        legacyDesktop: localStorage.getItem('clc_dx04_widget_desktop_slots_v1') || '',
        legacyMobile: localStorage.getItem('clc_dx04_widget_order') || '',
        apps, createdAt: ts()
      });
      try { localStorage.setItem('dx_desk_backup_' + uid, ref.id); } catch (_) {}
      return ref.id;
    }
    async function migrate() {
      if (migrating) return;
      migrating = true;
      try {
        if ((await deskRef('home').get({ source: 'server' })).exists) return; // 另一台裝置已轉換過
        const w = legacyData(), list = legacyCards(w);
        const backupId = await backupLegacy(w, '轉換前自動備份');
        const batch = window.db.batch();
        if (!(await deskRef('desktop').get()).exists) batch.set(deskRef('desktop'), { layout: legacyLayout(list, w), updatedAt: ts() });
        batch.set(deskRef('home'), { cards: list, migratedAt: ts(), backupId, updatedAt: ts() });
        await batch.commit();
      } catch (err) {
        console.warn('DX 桌面轉換失敗', err);
        notice('舊卡片轉換失敗（尚未改動任何資料）：' + errText(err));
        useCards(legacyCards(legacyData()), false); // 先照舊卡片顯示，不存
      } finally { migrating = false; }
    }
    // 其他裝置第一次打開時，也把那台瀏覽器的舊區塊備份一份（不改動桌面）
    function backupThisDevice() {
      const w = legacyData();
      try { if (!w || localStorage.getItem('dx_desk_backup_' + uid)) return; } catch (_) { return; }
      backupLegacy(w, '其他裝置的舊區塊備份').catch(err => console.warn('舊區塊備份失敗', err));
    }
    // 還原：把最新（或指定）備份寫回這台瀏覽器的舊區塊資料，再重新轉換一次（在主控台執行 dxDesktopRestore()）
    window.dxDesktopRestore = async backupId => {
      if (!uid) return '尚未登入';
      const col = userDoc().collection('desktop_backups');
      const snap = backupId ? await col.doc(backupId).get() : (await col.orderBy('createdAt', 'desc').limit(1).get()).docs[0];
      if (!snap || !snap.exists) return '找不到備份';
      if (!confirm('要用 ' + (snap.data().createdAt?.toDate?.().toLocaleString('zh-TW') || '') + ' 的備份重新建立 DX 桌面嗎？目前的卡片與排列會被取代。')) return '已取消';
      const d = snap.data();
      try {
        if (d.widgets) localStorage.setItem(LEGACY_KEY, d.widgets);
        ['desktop', 'phone'].forEach(m => localStorage.removeItem(layoutKey(m)));

          next = base.concat(item);
        }
        try {
          await persist(next);
          dialog.close();
        } catch (err) {
          console.warn('App 儲存失敗', err);
          showError(errorText(err));
          saveBtn.disabled = false;
        }
      });

      // ---------- 讀取 ----------
      render();
      checkEmbeds();
      window.addEventListener('clc-admin-changed', render);
      const finish = window.clcVerseWait?.();
      try {
        window.db.collection('dx04_settings').doc('apps').onSnapshot(snap => {
          finish?.();
          const items = snap.exists && Array.isArray(snap.data().items) ? snap.data().items : DEFAULT_APPS;
          const valid = items.filter(validItem);
          apps = valid.filter(inArea);
          try { localStorage.setItem(CACHE_KEY, JSON.stringify(valid)); } catch (_) {}
          render();
          checkEmbeds();
        }, err => { finish?.(); console.warn('分站清單讀取失敗（沿用快取或預設）', err); });
      } catch (err) {
        finish?.();
        console.warn('分站清單無法連線資料庫', err);
      }
      Object.assign(appApi, { openAdd, openEdit, remove: removeApp, name: id => apps.find(a => a.id === id)?.name || '' });
    }
    // 登入狀態（header.js 的 Firebase auth）
    start(window.auth?.currentUser);
    window.auth?.onAuthStateChanged?.(start);
  })();
  </script>
  <script>
    // 安裝事件須在登入前監聽，避免錯過 beforeinstallprompt 與 window.load。
    // PWA 安裝（與 YA 首頁相同做法）
    const pwaDisplayMode = window.matchMedia('(display-mode: standalone)');
    let deferredPrompt = null;
    let pwaInstalledInSession = false;
    let pwaInstallPromptPending = false;
    let pwaInstallHelp = null;
    let pwaInstallPreviousFocus = null;
    let pwaInstallHelpRequest = 0;
    // 已安裝記號：從 App 開啟或安裝完成時記下，之後在一般分頁也隱藏「安裝」。
    // Chrome 再次提示可安裝（beforeinstallprompt）代表已解除安裝，會清除記號。
    const PWA_INSTALLED_KEY = 'clc_dx04_installed';
    let pwaKnownInstalled = false;
    try { pwaKnownInstalled = localStorage.getItem(PWA_INSTALLED_KEY) === '1'; } catch (_) {}
    function setPwaKnownInstalled(value) {
      pwaKnownInstalled = value;
      try { value ? localStorage.setItem(PWA_INSTALLED_KEY, '1') : localStorage.removeItem(PWA_INSTALLED_KEY); } catch (_) {}
    }

    function isPwaStandalone() {
      return pwaDisplayMode.matches || window.navigator.standalone === true;
    }

    function checkPwaInstalledState() {
      const btn = document.getElementById('installAppBtn');
      if (!btn) return;
      if (isPwaStandalone() && !pwaKnownInstalled) setPwaKnownInstalled(true);
      const installed = isPwaStandalone() || pwaInstalledInSession;
      btn.hidden = installed;
      btn.classList.toggle('hidden', installed);
      btn.style.display = installed ? 'none' : '';
      btn.disabled = pwaInstallPromptPending;
      if (pwaInstallPromptPending) btn.setAttribute('aria-busy', 'true');
      else btn.removeAttribute('aria-busy');
      if (installed) closePwaInstallHelp();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW 失敗', err));
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (pwaKnownInstalled) setPwaKnownInstalled(false);
      const btn = document.getElementById('installAppBtn');
      if (btn) {
        btn.classList.add('bg-[#007E8A]/15', 'border-[#007E8A]/50', 'text-[#007E8A]', 'dark:text-teal-300');
      }
      checkPwaInstalledState();
    });

    window.addEventListener('appinstalled', () => {
      pwaInstalledInSession = true;
      setPwaKnownInstalled(true);
      deferredPrompt = null;
      checkPwaInstalledState();
    });

    async function pwaInstallInstructions() {
      const ua = navigator.userAgent;
      const isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        return [
          '使用 Safari 或 Chrome 開啟目前這個 DX04 網址。',
          '點選瀏覽器的「分享」按鈕，再選擇「加入主畫面」。',
          '確認名稱後點選「新增」，之後即可從主畫面開啟 CLC DX04。'
        ];
      }
      if (/Android/i.test(ua)) {
        return [
          '使用 Android Chrome 開啟目前這個 DX04 網址。',
          '點選右上角「⋮」選單，選擇「安裝應用程式」或「加入主畫面」。',
          '依畫面指示確認；完成後從主畫面或應用程式清單開啟 CLC DX04。'
        ];
      }
      let isBrave = false;
      try {
        isBrave = !!(navigator.brave && typeof navigator.brave.isBrave === 'function' &&
          await navigator.brave.isBrave());
      } catch (_) { /* 無法辨識時使用一般瀏覽器操作說明。 */ }
      if (isBrave) {
        return [
          '在 Brave 網址列右側尋找安裝圖示；或開啟右上角主選單，尋找「安裝 CLC DX04」或「安裝應用程式」。',
          '安裝項目可能位於「儲存與分享」或「投放、儲存與分享」子選單。',
          '若選單沒有安裝項目，可使用 Chrome 或 Edge 開啟目前這個 DX04 網址安裝。'
        ];
      }
      if (/Edg\//.test(ua)) {
        return [
          '在 Edge 網址列右側點選安裝圖示；或開啟右上角「⋯」選單。',
          '選擇「應用程式」→「將此網站安裝為應用程式」，再依畫面指示確認。',
          '完成後，從桌面或應用程式清單開啟 CLC DX04。'
        ];
      }
      if (/Chrome\//.test(ua)) {
        return [
          '在 Chrome 網址列右側點選安裝圖示；或開啟右上角「⋮」選單。',
          '尋找「安裝 CLC DX04」或「安裝網頁為應用程式」；安裝項目可能位於「投放、儲存與分享」內。',
          '依畫面指示確認後，從桌面或應用程式清單開啟 CLC DX04。'
        ];
      }
      return [
        '在目前瀏覽器的網址列或右上角選單，尋找「安裝應用程式」或「加入主畫面」。',
        '若沒有安裝項目，可使用 Chrome 或 Edge 開啟目前這個 DX04 網址安裝。'
      ];
    }

    function closePwaInstallHelp() {
      pwaInstallHelpRequest += 1;
      if (!pwaInstallHelp || pwaInstallHelp.style.display === 'none') return;
      pwaInstallHelp.style.display = 'none';
      document.removeEventListener('keydown', handlePwaInstallHelpKeydown, true);
      const previous = pwaInstallPreviousFocus;
      pwaInstallPreviousFocus = null;
      if (previous && previous.isConnected && !previous.hidden && !previous.disabled) previous.focus();
    }

    function handlePwaInstallHelpKeydown(event) {
      if (event.key === 'Escape') {
        event.preventDefault();
        event.stopImmediatePropagation();
        closePwaInstallHelp();
      } else if (event.key === 'Tab') {
        event.stopImmediatePropagation();
        const buttons = pwaInstallHelp.querySelectorAll('button');
        const first = buttons[0];
        const last = buttons[buttons.length - 1];
        if (event.shiftKey && (document.activeElement === first || !pwaInstallHelp.contains(document.activeElement))) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && (document.activeElement === last || !pwaInstallHelp.contains(document.activeElement))) {
          event.preventDefault();
          first.focus();
        }
      }
    }

    function createPwaInstallHelp() {
      const overlay = document.createElement('div');
      overlay.id = 'pwaInstallHelpOverlay';
      overlay.style.cssText = 'display:none;position:fixed;inset:0;z-index:2147483646;padding:16px;box-sizing:border-box;background:rgba(0,0,0,.7);align-items:center;justify-content:center;';
      overlay.innerHTML = `
        <section id="pwaInstallHelpDialog" role="dialog" aria-modal="true" aria-labelledby="pwaInstallHelpTitle" aria-describedby="pwaInstallHelpSummary pwaInstallHelpReason" style="box-sizing:border-box;width:100%;max-width:460px;max-height:calc(100% - 16px);overflow:auto;overscroll-behavior:contain;padding:24px;border:1px solid rgba(255,255,255,.15);border-radius:18px;background:#11131b;color:#f1f5f9;box-shadow:0 24px 70px rgba(0,0,0,.45);font:15px/1.7 Arial,'Microsoft JhengHei',sans-serif;text-align:left;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
            <h2 id="pwaInstallHelpTitle" style="margin:0;font-size:20px;font-weight:800;">安裝 CLC DX04</h2>
            <button id="pwaInstallHelpClose" type="button" aria-label="關閉安裝說明" style="flex:none;width:36px;height:36px;border:1px solid #64748b;border-radius:9px;background:transparent;color:#f1f5f9;cursor:pointer;font-size:20px;">×</button>
          </div>
          <p id="pwaInstallHelpSummary" style="margin:16px 0 0;">目前瀏覽器未提供直接安裝提示。</p>
          <p id="pwaInstallHelpReason" style="display:none;margin:8px 0 0;color:#fde68a;"></p>
          <ol id="pwaInstallHelpSteps" style="margin:16px 0;padding-left:24px;list-style:decimal;"></ol>
          <p style="margin:0 0 20px;color:#cbd5e1;font-size:13px;">若已經安裝，請從桌面或應用程式清單開啟 CLC DX04。</p>
          <button id="pwaInstallHelpDone" type="button" style="width:100%;min-height:44px;padding:10px 16px;border:0;border-radius:10px;background:#007e8a;color:white;cursor:pointer;font-size:15px;font-weight:700;">知道了</button>
        </section>`;
      overlay.querySelector('#pwaInstallHelpClose').addEventListener('click', closePwaInstallHelp);
      overlay.querySelector('#pwaInstallHelpDone').addEventListener('click', closePwaInstallHelp);
      overlay.addEventListener('click', event => {
        if (event.target === overlay) closePwaInstallHelp();
      });
      document.body.appendChild(overlay);
      pwaInstallHelp = overlay;
    }

    async function openPwaInstallHelp(reason = '') {
      const request = ++pwaInstallHelpRequest;
      const steps = await pwaInstallInstructions();
      if (request !== pwaInstallHelpRequest || isPwaStandalone() || pwaInstalledInSession) return;
      if (!pwaInstallHelp) createPwaInstallHelp();
      const list = pwaInstallHelp.querySelector('#pwaInstallHelpSteps');
      list.replaceChildren();
      steps.forEach(text => {
        const item = document.createElement('li');
        item.textContent = text;
        item.style.marginBottom = '8px';
        list.appendChild(item);
      });
      const reasonElement = pwaInstallHelp.querySelector('#pwaInstallHelpReason');
      reasonElement.textContent = reason;
      reasonElement.style.display = reason ? '' : 'none';
      pwaInstallHelp.querySelector('#pwaInstallHelpSummary').textContent = reason
        ? '這次未能完成直接安裝，仍可使用下方方式操作。'
        : '目前瀏覽器未提供直接安裝提示。';
      if (pwaInstallHelp.style.display === 'none') pwaInstallPreviousFocus = document.activeElement;
      pwaInstallHelp.style.display = 'flex';
      document.addEventListener('keydown', handlePwaInstallHelpKeydown, true);
      pwaInstallHelp.querySelector('#pwaInstallHelpClose').focus();
    }

    window.triggerPwaInstall = async function() {
      if (isPwaStandalone() || pwaInstalledInSession) {
        checkPwaInstalledState();
        return;
      }
      if (pwaInstallPromptPending) return;
      if (!deferredPrompt) {
        await openPwaInstallHelp();
        return;
      }
      closePwaInstallHelp();
      const promptEvent = deferredPrompt;
      deferredPrompt = null;
      pwaInstallPromptPending = true;
      checkPwaInstalledState();
      try {
        // 在使用者的點擊內立即呼叫；同一份原生提示僅能使用一次。
        const result = await promptEvent.prompt();
        const choice = result && typeof result.outcome === 'string'
          ? result : await promptEvent.userChoice;
        // 使用者取消是正常選擇；只有 appinstalled 才判定本次確實安裝完成。
        if (choice && choice.outcome === 'dismissed') return;
      } catch (err) {
        console.warn('安裝提示未能開啟:', err);
        let reason = '這次安裝提示未能開啟，請使用瀏覽器選單安裝，或稍後再試。';
        if (err && err.name === 'NotAllowedError') {
          reason = '瀏覽器目前不允許開啟直接安裝提示，請使用下方選單方式安裝。';
        } else if (err && err.name === 'InvalidStateError') {
          reason = '這次安裝提示已失效，請使用下方選單方式安裝，或稍後再試。';
        } else if (err && err.name === 'AbortError') {
          reason = '這次安裝已取消；你可以稍後再試，或使用下方方式安裝。';
        }
        await openPwaInstallHelp(reason);
      } finally {
        pwaInstallPromptPending = false;
        checkPwaInstalledState();
      }
    };

    if (typeof pwaDisplayMode.addEventListener === 'function') {
      pwaDisplayMode.addEventListener('change', checkPwaInstalledState);
    } else if (typeof pwaDisplayMode.addListener === 'function') {
      pwaDisplayMode.addListener(checkPwaInstalledState);
    }
    checkPwaInstalledState();
    document.addEventListener('DOMContentLoaded', checkPwaInstalledState);
    // 支援的瀏覽器（Chrome／Edge）直接詢問系統是否已安裝，只查一次。
    if (!isPwaStandalone() && typeof navigator.getInstalledRelatedApps === 'function') {
      navigator.getInstalledRelatedApps().then(apps => {
        // 只採用「已安裝」的結果；部分平台不支援偵測會回傳空清單，不據此判定未安裝。
        if (Array.isArray(apps) && apps.length > 0) { pwaInstalledInSession = true; setPwaKnownInstalled(true); }
        checkPwaInstalledState();
      }).catch(() => {});
    }
  </script>
