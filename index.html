  <script type="text/plain" data-dx-private>
    // 手機版區塊拖曳排序（Pointer 事件，觸控與滑鼠皆可），順序存在 localStorage
    (function () {
      const grid = document.getElementById('dashGrid');
      const KEY = 'clc_dx04_widget_order';
      const widgets = () => Array.from(grid.querySelectorAll(':scope > [data-widget]'));
      try {
        const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (Array.isArray(saved)) saved.forEach(k => { const el = grid.querySelector(':scope > [data-widget="' + k + '"]'); if (el) grid.appendChild(el); });
      } catch (_) {}
      function save() {
        try { localStorage.setItem(KEY, JSON.stringify(widgets().map(w => w.dataset.widget))); } catch (_) {}
      }
      let drag = null, pendingDrag = null;
      function cancelPendingDrag() {
        if (pendingDrag) clearTimeout(pendingDrag.timer);
        pendingDrag = null;
      }
      // 以「頁面座標」計算位移，捲動時區塊仍跟著手指
      function update() {
        if (!drag) return;
        const el = drag.el;
        const pageY = drag.clientY + window.scrollY;
        const dy = () => pageY - drag.startPageY + drag.base;
        el.style.transform = 'translateY(' + dy() + 'px)';
        const list = widgets();
        const i = list.indexOf(el);
        const prev = list[i - 1], next = list[i + 1];
        const naturalTop = el.getBoundingClientRect().top - dy();
        let moved = false;
        if (next) { const r = next.getBoundingClientRect(); if (drag.clientY > r.top + r.height / 2) { grid.insertBefore(next, el); moved = true; } }
        if (!moved && prev) { const r = prev.getBoundingClientRect(); if (drag.clientY < r.top + r.height / 2) { grid.insertBefore(el, prev); moved = true; } }
        if (moved) {
          el.style.transform = '';
          drag.base += naturalTop - el.getBoundingClientRect().top;
          el.style.transform = 'translateY(' + dy() + 'px)';
        }
      }
      function autoScroll() {
        if (!drag) return;
        const edge = 70, y = drag.clientY;
        let v = 0;
        if (y < edge) v = -Math.ceil((edge - y) / 5);
        else if (y > window.innerHeight - edge) v = Math.ceil((y - (window.innerHeight - edge)) / 5);
        if (v) { window.scrollBy(0, v); update(); }
        drag.raf = requestAnimationFrame(autoScroll);
      }
      grid.addEventListener('pointerdown', e => {
        const handle = e.target.closest('.drag-handle');
        if (!handle || e.button !== 0 || window.matchMedia('(min-width: 1024px)').matches) return;
        e.preventDefault();
        cancelPendingDrag();
        const el = handle.closest('[data-widget]');
        const pending = { el, id:e.pointerId, x:e.clientX, y:e.clientY, timer:null };
        pendingDrag = pending;
        handle.setPointerCapture(e.pointerId);
        pending.timer = setTimeout(() => {
          if (pendingDrag !== pending || !el.isConnected || window.matchMedia('(min-width: 1024px)').matches) return;
          pendingDrag = null;
          drag = { el, id:pending.id, clientY:pending.y, startPageY:pending.y + window.scrollY, base:0, raf:0 };
          el.classList.add('is-dragging');
          document.body.classList.add('dash-dragging');
          if (navigator.vibrate) navigator.vibrate(15);
          drag.raf = requestAnimationFrame(autoScroll);
        }, 500);
      });
      grid.addEventListener('pointermove', e => {
        if (pendingDrag && e.pointerId === pendingDrag.id &&
            Math.hypot(e.clientX - pendingDrag.x, e.clientY - pendingDrag.y) > 10) cancelPendingDrag();
        if (!drag || e.pointerId !== drag.id) return;
        drag.clientY = e.clientY;
        update();
      });
      function end(e) {
        if (pendingDrag && e.pointerId === pendingDrag.id) cancelPendingDrag();
        if (!drag || e.pointerId !== drag.id) return;
        cancelAnimationFrame(drag.raf);
        drag.el.classList.remove('is-dragging');
        drag.el.style.transform = '';
        document.body.classList.remove('dash-dragging');
        drag = null;
        save();
      }
      grid.addEventListener('pointerup', end);
      grid.addEventListener('pointercancel', end);
      grid.addEventListener('lostpointercapture', end);
      // 鍵盤：焦點在拖曳把手時，上下鍵移動
      grid.addEventListener('keydown', e => {
        const handle = e.target.closest('.drag-handle');
        if (!handle || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
        e.preventDefault();
        const el = handle.closest('[data-widget]');
        if (e.key === 'ArrowUp' && el.previousElementSibling) grid.insertBefore(el, el.previousElementSibling);
        if (e.key === 'ArrowDown' && el.nextElementSibling) grid.insertBefore(el.nextElementSibling, el);
        handle.focus();
        save();
      });
    })();

    // 時鐘與日期（台北時間）：以 Cloudflare 伺服器時間校正，不受本機時鐘誤差影響
    (function () {
      const timeEl = document.getElementById('clockTime');
      const secEl = document.getElementById('clockSec');
      const dateEl = document.getElementById('clockDate');
      const tz = 'Asia/Taipei';
      const fmtTime = new Intl.DateTimeFormat('zh-TW', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
      const fmtDate = new Intl.DateTimeFormat('zh-TW', { timeZone: tz, year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      let offset = 0; // 伺服器時間 − 本機時間（毫秒）
      async function syncTime() {
        try {
          const t0 = Date.now();
          const res = await fetch('/favicon.svg?t=' + t0, { method: 'HEAD', cache: 'no-store' });
          const t1 = Date.now();
          const server = Date.parse(res.headers.get('date'));
          if (!isNaN(server)) offset = server + 500 - (t0 + t1) / 2; // Date 只到秒，補半秒
        } catch (_) { /* 連不到時沿用本機時間 */ }
      }
      function tick() {
        const now = new Date(Date.now() + offset);
        const parts = Object.fromEntries(fmtTime.formatToParts(now).map(p => [p.type, p.value]));
        timeEl.textContent = parts.hour + ':' + parts.minute;
        secEl.textContent = ':' + parts.second;
        dateEl.textContent = fmtDate.format(now);
        setTimeout(tick, 1000 - (now.getTime() % 1000) + 5);
      }
      tick();
      syncTime();
      setInterval(syncTime, 10 * 60 * 1000);
    })();

    // 天氣：Open-Meteo（免金鑰），位置為板橋，每 30 分鐘更新
    (function () {
      const LAT = 25.0143, LON = 121.4672, PLACE = '板橋';
      const icons = {
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
        partly: '<path d="M8 3v1.5M3.5 8H2M4.8 4.8l1 1M12.5 5.5A4 4 0 0 0 5 8.5"/><path d="M8 20h9a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 8 20z"/>',
        cloud: '<path d="M7 19h10a4.5 4.5 0 0 0 .6-9 6 6 0 0 0-11.6 1.7A3.7 3.7 0 0 0 7 19z"/>',
        fog: '<path d="M7 14h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 14zM4 18h16M7 21h10"/>',
        rain: '<path d="M7 15h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 15zM8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
        storm: '<path d="M7 14h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 14zM12 15l-2 4h4l-2 4"/>'
      };
      function describe(code) {
        if (code === 0) return ['晴', 'sun'];
        if (code <= 2) return ['晴時多雲', 'partly'];
        if (code === 3) return ['陰', 'cloud'];
        if (code <= 48) return ['有霧', 'fog'];
        if (code <= 57) return ['毛毛雨', 'rain'];
        if (code <= 67) return ['雨', 'rain'];
        if (code <= 77) return ['雪', 'cloud'];
        if (code <= 82) return ['陣雨', 'rain'];
        return ['雷雨', 'storm'];
      }
      function setIcon(name) {
        document.getElementById('wxIcon').innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full" aria-hidden="true">' + icons[name] + '</svg>';
      }
      const refresh = document.getElementById('wxRefresh');
      let loading = false;
      let retryTimer = null;
      async function load() {
        if (loading) return;
        loading = true;
        clearTimeout(retryTimer);
        refresh.disabled = true;
        refresh.textContent = '讀取中…';
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
          '&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m' +
          '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=1&timezone=Asia%2FTaipei';
        try {
          const res = await fetch(url, { signal: controller.signal });
          if (!res.ok) throw new Error(res.status);
          const d = await res.json();
          const c = d.current, day = d.daily;
          const [text, icon] = describe(c.weather_code);
          refresh.hidden = true;
          setIcon(icon);
          document.getElementById('wxTemp').textContent = Math.round(c.temperature_2m) + '°';
          document.getElementById('wxDesc').textContent = text;
          document.getElementById('wxMeta').textContent =
            PLACE + ' · 高 ' + Math.round(day.temperature_2m_max[0]) + '° 低 ' + Math.round(day.temperature_2m_min[0]) +
            '° · 降雨 ' + (day.precipitation_probability_max[0] ?? 0) + '% · 濕度 ' + c.relative_humidity_2m + '%';
        } catch (err) {
          console.warn('天氣讀取失敗', err);
          setIcon('cloud');
          document.getElementById('wxDesc').textContent = '天氣暫時無法讀取';
          refresh.hidden = false;
          retryTimer = setTimeout(load, 2 * 60 * 1000);
        } finally {
          clearTimeout(timeout);
          loading = false;
          refresh.disabled = false;
          refresh.textContent = '↻ 重新整理';
        }
      }
      refresh.addEventListener('click', load);
      load();
      setInterval(load, 30 * 60 * 1000);
    })();

    // 今日待辦：Firestore dx04_todos（僅 Superuser）。文字或語音輸入，會自動辨識日期、時間與 #標籤。
    (function () {
      const TZ = 'Asia/Taipei';
      const body = document.getElementById('todoBody');
      const form = document.getElementById('todoAddForm');
      const input = document.getElementById('todoAddInput');
      const statusEl = document.getElementById('todoStatus');
      const summary = document.getElementById('todoSummary');
      const doneToggle = document.getElementById('todoDoneToggle');
      const doneList = document.getElementById('todoDoneList');
      const doneCount = document.getElementById('todoDoneCount');
      let todos = [], unsub = null, showDone = false;

      // ---------- 日期工具（一律以台北日期計算） ----------
      const fmtYmd = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
      const ymd = d => fmtYmd.format(d);
      const today = () => ymd(new Date());
      function addDays(dateStr, n) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dt = new Date(Date.UTC(y, m - 1, d + n));
        return dt.toISOString().slice(0, 10);
      }
      function weekday(dateStr) { const [y, m, d] = dateStr.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); }
      function dueLabel(due) {
        if (!due) return '';
        const t = today();
        if (due === t) return '今天';
        if (due === addDays(t, 1)) return '明天';
        if (due === addDays(t, -1)) return '昨天';
        if (due === addDays(t, 2)) return '後天';
        const [, m, d] = due.split('-').map(Number);
        return m + '/' + d + '（' + '日一二三四五六'[weekday(due)] + '）';
      }

      // ---------- 自然語言解析 ----------
      const CN = { 零: 0, 〇: 0, 一: 1, 二: 2, 兩: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10 };
      function cnNum(s) {
        if (/^\d+$/.test(s)) return Number(s);
        if (s === '十') return 10;
        let m = s.match(/^([一二兩两三四五六七八九])?十([一二三四五六七八九])?$/);
        if (m) return (m[1] ? CN[m[1]] : 1) * 10 + (m[2] ? CN[m[2]] : 0);
        if (s.length === 1 && s in CN) return CN[s];
        return NaN;
      }
      const NUM = '(\\d{1,2}|[零〇一二兩两三四五六七八九十]{1,3})';
      const TAGS = { ya: 'CLC YA', sr: 'CLC SR', dx: 'CLC DX04', dx04: 'CLC DX04', 聖誕: 'Christmas', christmas: 'Christmas' };
      function parse(text) {
        let t = ' ' + text.trim() + ' ';
        let due = '', time = '', tag = '';
        const cut = re => { const m = t.match(re); if (m) t = t.replace(m[0], ' '); return m; };

        let m = cut(/[#＃]([^\s#＃]{1,20})/);
        if (m) tag = TAGS[m[1].toLowerCase()] || m[1];

        const base = today();
        if ((m = cut(/大[後后]天/))) due = addDays(base, 3);
        else if ((m = cut(/[後后]天/))) due = addDays(base, 2);
        else if ((m = cut(/明[天日早晚]?/))) due = addDays(base, 1);
        else if ((m = cut(/今[天日早晚]|今晚/))) due = base;
        else if ((m = cut(/(下{1,2})?(?:週|周|星期|禮拜|礼拜)([一二三四五六日天])/))) {
          const want = '日一二三四五六'.indexOf(m[2] === '天' ? '日' : m[2]);
          const diff = (want - weekday(base) + 7) % 7;
          due = addDays(base, m[1] ? nextWeek(base, want, m[1].length) : diff);
        } else if ((m = cut(new RegExp('(?:(\\d{4})[/年-])?(\\d{1,2})\\s*[/月]\\s*(\\d{1,2})\\s*[日號号]?')))) {
          const y0 = Number(base.slice(0, 4));
          let y = m[1] ? Number(m[1]) : y0;
          const mm = String(Number(m[2])).padStart(2, '0'), dd = String(Number(m[3])).padStart(2, '0');
          let cand = y + '-' + mm + '-' + dd;
          if (!m[1] && cand < addDays(base, -60)) cand = (y + 1) + '-' + mm + '-' + dd;
          if (Number(mm) >= 1 && Number(mm) <= 12 && Number(dd) >= 1 && Number(dd) <= 31) due = cand;
        }

        // 時間：15:30、下午3點半、晚上七點十五分
        if ((m = cut(/(\d{1,2})[:：](\d{2})/))) {
          time = String(Math.min(23, Number(m[1]))).padStart(2, '0') + ':' + m[2];
        } else if ((m = cut(new RegExp('(早上|上午|中午|下午|傍晚|晚上|凌晨)?\\s*' + NUM + '\\s*[點点時时](?:\\s*(半|' + NUM + '\\s*分?))?')))) {
          let h = cnNum(m[2]);
          let min = m[3] === '半' ? 30 : (m[4] ? cnNum(m[4]) : 0);
          if (!isNaN(h) && h <= 24 && !isNaN(min) && min < 60) {
            if (/下午|傍晚|晚上/.test(m[1] || '') && h < 12) h += 12;
            if (m[1] === '中午' && h < 6) h += 12;
            time = String(h % 24).padStart(2, '0') + ':' + String(min).padStart(2, '0');
          }
        }
        if (time && !due) due = base;

        let title = t.replace(/\s+/g, ' ').trim();
        if (!title) title = text.trim();
        return { title, due, time, tag };
      }
      function nextWeek(base, want, level) {
        // 「下週X」：下一個週一開始的那一週裡的 X；「下下週」再加一週。週日視為一週最後一天。
        const wd = weekday(base) || 7;
        const toNextMonday = 8 - wd;
        const offset = (want === 0 ? 6 : want - 1);
        return toNextMonday + offset + 7 * (level - 1);
      }

      // ---------- 畫面 ----------
      function setStatus(msg) { statusEl.textContent = msg || ''; statusEl.classList.toggle('hidden', !msg); }
      function canUse() { return !!window.isSuperuser && !!window.db; }

      function row(todo, opts) {
        opts = Object.assign({}, opts, { overdue: !todo.done && !!todo.due && todo.due < today() });
        const li = document.createElement('li');
        li.className = 'todo-row';
        li.dataset.sortId = todo.id;
        if (!todo.done) {
          const handle = document.createElement('button');
          handle.type = 'button'; handle.className = 'reorder-handle'; handle.textContent = '⠿';
          handle.setAttribute('aria-label', '拖曳排序：' + todo.title);
          handle.title = '';
          li.append(handle);
        }
        const label = document.createElement('div');
        label.className = 'todo-item';
        const hit = document.createElement('label');
        hit.className = 'todo-ck-hit';
        const ck = document.createElement('input');
        ck.type = 'checkbox';
        ck.className = 'todo-ck' + (opts.overdue ? ' p1' : '');
        ck.checked = !!todo.done;
        ck.setAttribute('aria-label', (todo.done ? '取消完成：' : '完成：') + todo.title);
        ck.addEventListener('change', () => toggleDone(todo, ck.checked));
        hit.append(ck);
        const text = document.createElement('span');
        text.className = 'todo-text';
        text.tabIndex = 0;
        text.setAttribute('role', 'button');
        text.setAttribute('aria-label', '雙擊修改：' + todo.title);
        // 滑鼠雙擊或手機連點兩下才編輯；鍵盤 Enter 保留。
        let lastTapAt = 0, touchDownAt = 0, lastPointerType = '';
        text.addEventListener('pointerdown', e => {
          lastPointerType = e.pointerType;
          touchDownAt = e.pointerType === 'touch' ? performance.now() : 0;
        });
        text.addEventListener('click', e => {
          const isTouch = (e.pointerType || lastPointerType) === 'touch';
          if (!isTouch) {
            if (e.detail >= 2 || e.detail === 0) startEdit(todo, text);
            return;
          }
          if (e.detail === 0 && !e.pointerType) { startEdit(todo, text); return; }
          const now = performance.now();
          // 長按放開不應被算成點擊或進入編輯，包含拖曳未啟動的情況。
          if (touchDownAt && now - touchDownAt >= 350) { lastTapAt = 0; return; }
          if (lastTapAt && now - lastTapAt <= 350) {
            lastTapAt = 0;
            startEdit(todo, text);
          } else {
            lastTapAt = now;
          }
        });
        text.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); startEdit(todo, text); } });
        const title = document.createElement('span');
        title.className = 'todo-title';
        title.textContent = todo.title;
        text.append(title);
        const metaParts = [];
        if (todo.due && (opts.showDate || todo.due !== today())) metaParts.push(dueLabel(todo.due));
        if (todo.time) metaParts.push(todo.time);
        if (metaParts.length || todo.tag) {
          const meta = document.createElement('span');
          meta.className = 'todo-meta' + (opts.overdue ? ' is-overdue' : '');
          meta.textContent = metaParts.join(' ');
          if (todo.tag) {
            const tag = document.createElement('span');
            tag.className = 'todo-tag';
            tag.textContent = (metaParts.length ? ' · ' : '') + todo.tag;
            meta.append(tag);
          }
          text.append(meta);
        }
        label.append(hit, text);
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'todo-del';
        del.setAttribute('aria-label', '刪除：' + todo.title);
        del.title = '刪除';
        del.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
        del.addEventListener('click', () => removeTodo(todo));
        li.append(label, del);
        enableSwipeDelete(li, todo);
        return li;
      }
      // 手機：往右滑過一半寬度就刪除（不顯示 ×，避免誤刪）
      function enableSwipeDelete(li, todo) {
        let start = null, dx = 0, active = false;
        li.addEventListener('pointerdown', e => {
          if (e.pointerType !== 'touch' || e.target.closest('.todo-edit, .reorder-handle')) return;
          start = { x: e.clientX, y: e.clientY }; dx = 0; active = false;
        });
        li.addEventListener('pointermove', e => {
          if (!start) return;
          const mx = e.clientX - start.x, my = e.clientY - start.y;
          if (!active) {
            if (Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)) { start = null; return; }
            if (mx > 12 && mx > Math.abs(my)) { active = true; li.classList.add('is-swiping'); try { li.setPointerCapture(e.pointerId); } catch (_) {} }
            else return;
          }
          dx = Math.max(0, mx);
          li.style.setProperty('--swipe', dx + 'px');
          li.classList.toggle('will-delete', dx > li.offsetWidth * 0.5);
        });
        const end = () => {
          if (!start) return;
          start = null;
          if (!active) return;
          li.classList.remove('is-swiping');
          if (dx > li.offsetWidth * 0.5) {
            li.style.setProperty('--swipe', li.offsetWidth + 'px');
            li.classList.add('is-removing');
            setTimeout(() => removeTodo(todo), 180);
          } else {
            li.style.setProperty('--swipe', '0px');
            li.classList.remove('will-delete');
          }
        };
        li.addEventListener('pointerup', end);
        li.addEventListener('pointercancel', end);
        // 滑動後放開不要觸發點文字修改
        li.addEventListener('click', e => { if (active) { e.stopPropagation(); e.preventDefault(); active = false; } }, true);
      }
      function group(title, cls, items, opts) {
        if (!items.length) return;
        const h = document.createElement('h3');
        h.className = 'todo-group ' + cls;
        h.textContent = title;
        const ul = document.createElement('ul');
        ul.className = 'todo-list';
        items.forEach(t => ul.append(row(t, opts)));
        body.append(h, ul);
      }
      const orderKey = () => 'clc_dx04_todo_order:' + String(window.currentAdminEmail || '').toLowerCase();
      function readOrder() {
        try { const v = JSON.parse(localStorage.getItem(orderKey()) || '[]'); return Array.isArray(v) ? v : []; } catch (_) { return []; }
      }
      window.clcReorder(body, {
        item: '.todo-row', directMouse: true, allowed: () => !!window.isSuperuser,
        move(from, to, after) {
          const rows = Array.from(body.querySelectorAll('.todo-row'));
          const ids = rows.map(el => el.dataset.sortId).filter(id => id !== from);
          ids.splice(ids.indexOf(to) + (after ? 1 : 0), 0, from);
          localStorage.setItem(orderKey(), JSON.stringify(ids));
          render();
        },
        error: () => setStatus('無法保存排序，請確認瀏覽器允許本機儲存。')
      });
      const byNewest = (a, b) => b.created - a.created || b.id.localeCompare(a.id);

      function render() {
        body.replaceChildren();
        doneList.replaceChildren();
        if (!window.isSuperuser) {
          summary.textContent = '';
          input.disabled = true;
          input.placeholder = '以 Superuser 登入後可新增待辦';
          doneCount.textContent = '0';
          const p = document.createElement('p');
          p.className = 'todo-empty';
          p.textContent = '這是個人待辦，登入後顯示。';
          body.append(p);
          return;
        }
        input.disabled = false;
        input.placeholder = '新增待辦… 例如「明天下午3點 回覆新朋友 #SR」';
        const t = today();
        const order = readOrder();
        const rank = new Map(order.map((id, i) => [id, i]));
        const byOrder = (a, b) => (rank.get(a.id) ?? -1) - (rank.get(b.id) ?? -1) || byNewest(a, b);
        const open = todos.filter(x => !x.done);
        const overdue = open.filter(x => x.due && x.due < t).sort(byOrder);
        group('待辦', '', open.sort(byOrder), { showDate: true });
        if (!open.length) {
          const p = document.createElement('p');
          p.className = 'todo-empty';
          p.textContent = todos.length ? '今天的事都完成了。' : '還沒有待辦，從上面輸入或按麥克風說一句。';
          body.append(p);
        }
        const weekAgo = Date.now() - 7 * 864e5;
        const done = todos.filter(x => x.done && (x.doneMs || 0) >= weekAgo).sort((a, b) => (b.doneMs || 0) - (a.doneMs || 0));
        const doneToday = done.filter(x => x.doneMs && ymd(new Date(x.doneMs)) === t).length;
        doneCount.textContent = doneToday;
        done.forEach(x => doneList.append(row(x, { showDate: true })));
        doneList.classList.toggle('hidden', !showDone || !done.length);
        summary.textContent = open.length + ' 項未完成' + (overdue.length ? ' · ' : '');
        if (overdue.length) {
          const s = document.createElement('span');
          s.className = 'text-orange-600 dark:text-orange-400';
          s.textContent = overdue.length + ' 項逾期';
          summary.append(s);
        }
      }
      doneToggle.addEventListener('click', () => {
        showDone = !showDone;
        doneToggle.setAttribute('aria-expanded', String(showDone));
        doneToggle.classList.toggle('is-open', showDone);
        render();
      });
      // 跨過午夜時重新分組
      let lastDay = today();
      setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);

      // ---------- 資料 ----------
      function errText(err) {
        return err && err.code === 'permission-denied'
          ? '權限不足：請確認已用 Superuser 登入，並已發布最新的 firestore.rules。'
          : '連線失敗，請稍後再試。';
      }
      const col = () => window.db.collection('dx04_todos');
      function subscribe() {
        if (unsub) { unsub(); unsub = null; }
        todos = [];
        if (!canUse()) { render(); return; }
        unsub = col().limit(500).onSnapshot(snap => {
          todos = snap.docs.map(d => {
            const x = d.data();
            return {
              raw: x, id: d.id, title: String(x.title || ''), due: x.due || '', time: x.time || '', tag: x.tag || '',
              done: !!x.done,
              doneMs: x.doneAt && x.doneAt.toMillis ? x.doneAt.toMillis() : (x.done ? Date.now() : 0),
              created: x.createdAt && x.createdAt.toMillis ? x.createdAt.toMillis() : Date.now()
            };
          }).filter(x => x.title);
          setStatus('');
          render();
        }, err => { console.warn('待辦讀取失敗', err); setStatus(errText(err)); render(); });
      }
      async function addTodo(text) {
        const p = parse(text);
        const FV = firebase.firestore.FieldValue;
        const existingOrder = readOrder();
        const rank = new Map(existingOrder.map((id, i) => [id, i]));
        const previousIds = todos.filter(t => !t.done).sort((a, b) => (rank.get(a.id) ?? -1) - (rank.get(b.id) ?? -1) || byNewest(a, b)).map(t => t.id);
        const added = await col().add({
          title: p.title.slice(0, 200), due: p.due, time: p.time, tag: p.tag.slice(0, 20),
          done: false, doneAt: null, createdAt: FV.serverTimestamp(), updatedAt: FV.serverTimestamp()
        });
        try { localStorage.setItem(orderKey(), JSON.stringify([added.id, ...previousIds.filter(id => id !== added.id)])); } catch (_) {}
        render();
      }
      function toggleDone(todo, done) {
        const FV = firebase.firestore.FieldValue;
        col().doc(todo.id).update({ done, doneAt: done ? FV.serverTimestamp() : null, updatedAt: FV.serverTimestamp() })
          .catch(err => { console.warn('待辦更新失敗', err); setStatus(errText(err)); render(); });
      }
      const undoEntries = new Map(), deleting = new Set();
      let undoBar = null, undoBusy = false;
      function showUndo() {
        if (!undoBar) {
          undoBar = document.createElement('div');
          undoBar.id = 'todoUndoBar';
          undoBar.setAttribute('role', 'status');
          undoBar.setAttribute('aria-live', 'polite');
          undoBar.style.cssText = 'position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:1000;max-width:calc(100vw - 32px);padding:12px 18px;border-radius:14px;background:#242a38;color:#fff;box-shadow:0 8px 30px #0006;display:flex;align-items:center;gap:18px;font-size:14px;';
          const message = document.createElement('span'); message.id = 'todoUndoMessage';
          const button = document.createElement('button'); button.id = 'todoUndoButton'; button.type = 'button';
          button.textContent = '復原 Undo'; button.style.cssText = 'flex:none;background:none;border:0;color:#67e8f9;font:700 14px Arial;padding:8px;cursor:pointer;';
          button.addEventListener('click', undoDelete);
          undoBar.append(message, button); document.body.append(undoBar);
        }
        undoBar.hidden = !undoEntries.size;
        undoBar.style.display = undoEntries.size ? 'flex' : 'none';
        undoBar.querySelector('#todoUndoMessage').textContent = `已刪除 ${undoEntries.size} 項待辦`;
        undoBar.querySelector('button').disabled = undoBusy;
      }
      function expireUndo(id) {
        const entry = undoEntries.get(id); if (!entry) return;
        clearTimeout(entry.timer); undoEntries.delete(id); showUndo();
      }
      async function removeTodo(todo) {
        if (deleting.has(todo.id) || !canUse()) return;
        deleting.add(todo.id);
        try {
          await col().doc(todo.id).delete();
          const entry = { data: todo.raw, timer: setTimeout(() => expireUndo(todo.id), 5000) };
          undoEntries.set(todo.id, entry); showUndo();
        } catch (err) { console.warn('待辦刪除失敗', err); setStatus(errText(err)); }
        finally { deleting.delete(todo.id); }
      }
      async function undoDelete() {
        if (undoBusy || !canUse()) return;
        undoBusy = true;
        const entries = Array.from(undoEntries.entries());
        entries.forEach(([, entry]) => clearTimeout(entry.timer)); showUndo();
        try {
          for (const [id, entry] of entries) {
            try { await col().doc(id).set(entry.data); undoEntries.delete(id); }
            catch (err) {
              entry.timer = setTimeout(() => expireUndo(id), 5000);
              console.warn('待辦復原失敗', err); setStatus('復原未完成，請再按一次 Undo。' + errText(err));
            }
          }
        } finally { undoBusy = false; showUndo(); }
      }
      // ---------- 修改：點文字變成輸入框，Enter／離開存檔，Esc 取消，清空等於刪除 ----------
      const TAG_SHORT = { 'CLC YA': 'YA', 'CLC SR': 'SR', 'CLC DX04': 'DX04', 'Christmas': '聖誕' };
      function rawText(todo) {
        const parts = [todo.title];
        if (todo.due) { const [, m, d] = todo.due.split('-').map(Number); parts.push(m + '/' + d); }
        if (todo.time) parts.push(todo.time);
        if (todo.tag) parts.push('#' + (TAG_SHORT[todo.tag] || todo.tag.replace(/\s+/g, '')));
        return parts.join(' ');
      }
      function startEdit(todo, textEl) {
        const box = document.createElement('input');
        box.type = 'text';
        box.className = 'todo-edit';
        box.maxLength = 220;
        box.value = rawText(todo);
        box.setAttribute('aria-label', '修改待辦');
        textEl.replaceWith(box);
        box.focus();
        let finished = false;
        const finish = async save => {
          if (finished) return;
          finished = true;
          const v = box.value.trim();
          if (!save || v === rawText(todo)) { render(); return; }
          try {
            if (!v) await col().doc(todo.id).delete();
            else {
              const p = parse(v);
              await col().doc(todo.id).update({ title: p.title.slice(0, 200), due: p.due, time: p.time, tag: p.tag.slice(0, 20), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
            }
          } catch (err) { console.warn('待辦修改失敗', err); setStatus(errText(err)); render(); }
        };
        box.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); finish(true); }
          else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
        });
        box.addEventListener('blur', () => finish(true));
      }

      // ---------- 一次貼上多行：每行一項 ----------
      input.addEventListener('paste', async e => {
        const text = (e.clipboardData || window.clipboardData).getData('text') || '';
        if (!/[\r\n]/.test(text.trim())) return;
        e.preventDefault();
        if (!canUse()) return;
        const lines = text.split(/\r?\n/).map(l => l.replace(/^\s*(?:[-*•・·]|\d+[.)、])\s*/, '').trim()).filter(Boolean).slice(0, 50);
        setStatus('新增 ' + lines.length + ' 項…');
        try { for (const line of lines) await addTodo(line); setStatus(''); }
        catch (err) { console.warn('待辦新增失敗', err); setStatus(errText(err)); }
      });

      form.addEventListener('submit', async e => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || !canUse()) return;
        input.value = '';
        try { await addTodo(text); }
        catch (err) { console.warn('待辦新增失敗', err); input.value = text; setStatus(errText(err)); }
      });

      // ---------- 語音輸入：預設用瀏覽器內建語音辨識（快）；不支援或失敗（Brave、Firefox 等）時自動改用錄音 + Gemini AI 判讀 ----------
      const mic = document.getElementById('todoMicBtn');
      if (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function' && typeof MediaRecorder !== 'undefined') {
        mic.classList.remove('hidden');
        let recorder = null, stream = null, chunks = [], before = '', stopTimer = null, busy = false;

        function cleanupMic() {
          if (stopTimer) { clearTimeout(stopTimer); stopTimer = null; }
          if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
          recorder = null;
          mic.classList.remove('is-listening');
          mic.setAttribute('aria-label', '語音輸入');
        }

        function blobToBase64(blob) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => {
              const res = String(reader.result || '');
              const idx = res.indexOf(',');
              resolve(idx >= 0 ? res.slice(idx + 1) : '');
            };
            reader.onerror = () => reject(new Error('讀取音訊失敗'));
            reader.readAsDataURL(blob);
          });
        }

        // 內建語音辨識：Chrome、Edge、Safari 有；失敗過一次（例如 Brave 的 network）就記在本機，之後直接用 AI
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const SPEECH_BROKEN_KEY = 'clc_dx04_speech_broken';
        let speech = null;
        function speechUsable() {
          if (!SpeechRec) return false;
          try { return localStorage.getItem(SPEECH_BROKEN_KEY) !== '1'; } catch (_) { return true; }
        }
        function markSpeechBroken() { try { localStorage.setItem(SPEECH_BROKEN_KEY, '1'); } catch (_) {} }
        function startWebSpeech() {
          const rec = new SpeechRec();
          speech = rec;
          rec.lang = 'zh-TW';
          rec.interimResults = true;
          rec.continuous = false;
          before = input.value.trim();
          let finalText = '', fallback = false;
          rec.onstart = () => { mic.classList.add('is-listening'); mic.setAttribute('aria-label', '停止語音輸入'); setStatus('請說…（說完會自動加入）'); };
          rec.onresult = ev => {
            let interim = '';
            finalText = '';
            for (const r of ev.results) { if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
            input.value = (before ? before + ' ' : '') + (finalText || interim);
          };
          rec.onerror = ev => {
            const e = ev.error;
            if (e === 'no-speech' || e === 'aborted') { setStatus(e === 'no-speech' ? '沒有聽到聲音，再按一次麥克風試試。' : ''); return; }
            // 麥克風被拒：AI 模式也需要麥克風，所以不切換
            if (e === 'not-allowed' || e === 'audio-capture') { setStatus(e === 'audio-capture' ? '找不到麥克風，或麥克風被其他程式占用。' : '麥克風權限被拒絕，請到瀏覽器設定允許此網站使用麥克風。'); return; }
            // network、service-not-allowed、language-not-supported 等：這個瀏覽器用不了內建辨識，改用 AI
            markSpeechBroken();
            fallback = true;
          };
          rec.onend = () => {
            speech = null;
            mic.classList.remove('is-listening');
            mic.setAttribute('aria-label', '語音輸入');
            if (fallback) { input.value = before; setStatus('這個瀏覽器的內建語音辨識無法使用，改用 AI 辨識…'); startAiRecording(); return; }
            if (finalText.trim()) { setStatus(''); form.requestSubmit(); }
          };
          try { rec.start(); } catch (_) { speech = null; markSpeechBroken(); startAiRecording(); }
        }

        mic.addEventListener('click', () => {
          if (!canUse() || busy) return;
          // 正在錄音或聆聽中：再按一次停止
          if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
          if (speech) { speech.stop(); return; }
          if (speechUsable()) startWebSpeech(); else startAiRecording();
        });

        async function startAiRecording() {
          before = input.value.trim();
          chunks = [];
          try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          } catch (err) {
            cleanupMic();
            const name = err && err.name;
            setStatus(name === 'NotAllowedError' || name === 'PermissionDeniedError'
              ? '麥克風權限被拒絕，請到瀏覽器設定允許此網站使用麥克風。'
              : name === 'NotFoundError' || name === 'DevicesNotFoundError'
              ? '找不到麥克風，或麥克風被其他程式占用。'
              : '無法開啟麥克風：' + (name || '未知原因'));
            return;
          }

          const mimeCandidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
          const chosenMime = mimeCandidates.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
          try {
            recorder = chosenMime ? new MediaRecorder(stream, { mimeType: chosenMime }) : new MediaRecorder(stream);
          } catch (_) {
            cleanupMic();
            setStatus('此瀏覽器不支援錄音格式。');
            return;
          }

          recorder.ondataavailable = ev => { if (ev.data && ev.data.size > 0) chunks.push(ev.data); };
          recorder.onstart = () => {
            mic.classList.add('is-listening');
            mic.setAttribute('aria-label', '停止錄音並辨識');
            setStatus('AI 錄音中… 說完請再按一次麥克風');
            // 最長錄音 30 秒自動停止
            stopTimer = setTimeout(() => { if (recorder && recorder.state === 'recording') recorder.stop(); }, 30000);
          };
          recorder.onstop = async () => {
            const mimeType = (recorder && recorder.mimeType) || chosenMime || 'audio/webm';
            cleanupMic();
            if (!chunks.length) { setStatus('沒有錄到聲音，再按一次麥克風試試。'); return; }
            const blob = new Blob(chunks, { type: mimeType });
            chunks = [];
            if (blob.size < 800) { setStatus('錄音時間太短，沒有聽到聲音。'); return; }

            busy = true;
            mic.disabled = true;
            setStatus('AI 判讀中…');
            try {
              const audio = await blobToBase64(blob);
              // 最多等 50 秒，逾時就顯示錯誤，不會一直卡住
              const ctrl = new AbortController();
              const timer = setTimeout(() => ctrl.abort(), 50000);
              let res;
              try {
                res = await fetch('/api/transcribe', {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({ audio, mimeType }),
                  signal: ctrl.signal
                });
              } finally { clearTimeout(timer); }
              const data = await res.json().catch(() => ({}));
              if (!res.ok || !data.ok) {
                setStatus((data && data.error) || '語音辨識失敗，請稍後再試。');
                return;
              }
              const text = String(data.text || '').trim();
              if (!text) {
                setStatus('沒有聽到清楚的內容，再按一次麥克風試試。');
                return;
              }
              input.value = (before ? before + ' ' : '') + text;
              setStatus('');
              form.requestSubmit();
            } catch (err) {
              setStatus(err && err.name === 'AbortError' ? 'AI 判讀逾時，請再試一次。' : '連線失敗，無法進行語音辨識。');
            } finally {
              busy = false;
              mic.disabled = false;
            }
          };

          try {
            recorder.start();
          } catch (_) {
            cleanupMic();
            setStatus('語音輸入無法啟動。');
          }
        }
      }

      window.clcTodoParse = parse; // 方便除錯
      render();
      window.addEventListener('clc-admin-changed', subscribe);
      if (window.isSuperuser) subscribe();
    })();
  </script>
  <script src="clc-sso.js"></script>
  <script src="header.js"></script>
  <script type="text/plain" data-dx-private>
    // 分站入口：清單存在 Firestore dx04_settings/apps（所有裝置共用），本機另存一份快取讓畫面先出來。
    // 管理員：長按任一格進入「編輯模式」（像 iPhone 主畫面）→ 按「−」移除、按「＋」貼網址新增、點 Logo 改名稱或圖示。
    // 名稱與 Logo 由 /api/site-info 自動抓（和手機「加入主畫面」相同來源）。
    // 開啟方式：YA、SR 用 CLC_SITES 網址（和左上角 Logo 站台選單相同）；其他網站在 DX04 Header 底下的 app.html 內開啟。
    (function () {
      const grid = document.getElementById('siteGrid');
      const hint = document.getElementById('appsAdminHint');
      const doneBtn = document.getElementById('appsDoneBtn');
      const CACHE_KEY = 'clc_dx04_apps';
      const MIN_SLOTS = 8, MAX_APPS = 40, LONG_PRESS_MS = 550;
      const DEFAULT_APPS = [
        { id: 'ya', site: 'ya', name: 'CLC YA', url: 'https://clc-dx04.pages.dev/ya/', icon: '/ya/apple-touch-icon.png' },
        { id: 'sr', site: 'sr', name: 'CLC SR', url: 'https://clc-dx04.pages.dev/sr/', icon: '/sr/apple-touch-icon.png' }
      ];
      let apps = DEFAULT_APPS;
      let editing = false;
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (Array.isArray(cached)) apps = cached;
      } catch (_) {}

      const isAdmin = () => !!window.isAdmin;
      // 只接受 http(s) 或站內路徑，避免 javascript: 之類的連結。
      function safeUrl(value) {
        const v = String(value || '').trim();
        if (!v) return '';
        if (v.startsWith('/') && !v.startsWith('//')) return v;
        try { const u = new URL(v); return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : ''; } catch (_) { return ''; }
      }
      function normalizeInputUrl(value) {
        let v = String(value || '').trim();
        if (!v) return '';
        if (!/^https?:\/\//i.test(v) && /^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/i.test(v)) v = 'https://' + v;
        const u = safeUrl(v);
        return u && !u.startsWith('/') ? u : '';
      }
      function isSameSite(url) {
        try {
          const u = new URL(url, location.href);
          return u.origin === location.origin || u.hostname === 'clc-dx04.pages.dev';
        } catch (_) { return false; }
      }
      // 外部網站是否允許內嵌：新增時存在 app.embeddable；舊資料由 /api/site-info 補查，結果存在本機。
      const EMBED_KEY = 'clc_dx04_embed';
      let embedMap = {};
      try { embedMap = JSON.parse(localStorage.getItem(EMBED_KEY) || '{}') || {}; } catch (_) {}
      const embedChecking = new Set();
      function embeddableOf(app) {
        if (typeof app.embeddable === 'boolean') return app.embeddable;
        const url = safeUrl(app.url);
        return url in embedMap ? embedMap[url] : null;
      }
      function checkEmbeds() {
        apps.forEach(app => {
          const url = safeUrl(app.url);
          if (app.site || !url || isSameSite(url) || embeddableOf(app) !== null || embedChecking.has(url)) return;
          embedChecking.add(url);
          fetch('/api/site-info?url=' + encodeURIComponent(url)).then(r => r.json()).then(info => {
            embedMap[url] = !!(info && info.ok && info.embeddable);
            try { localStorage.setItem(EMBED_KEY, JSON.stringify(embedMap)); } catch (_) {}
            render();
          }).catch(() => {});
        });
      }
      // 回傳 { href, newTab }：YA、SR 照 CLC_SITES；本站網址直接開；允許內嵌的外部網站開在 DX04 Header 底下；
      // 不允許內嵌（或還不確定時讀不到）的外部網站直接開新分頁。
      function linkFor(app) {
        const site = app.site && (window.CLC_SITES || []).find(s => s.key === app.site);
        if (site) return { href: site.url, newTab: false };
        const url = safeUrl(app.url);
        if (!url) return { href: '#', newTab: false };
        if (isSameSite(url)) return { href: url, newTab: false };
        if (embeddableOf(app) === false) return { href: url, newTab: true };
        return { href: '/app.html?id=' + encodeURIComponent(app.id), newTab: false };
      }
      function hrefFor(app) { return linkFor(app).href; }
      function initials(name) {
        const n = String(name || '').replace(/^CLC\s+/i, '').trim();
        return (n.slice(0, 2) || '?').toUpperCase();
      }
      function logo(app) {
        const icon = safeUrl(app.icon);
        const fallback = () => {
          const span = document.createElement('span');
          span.className = 'app-fallback';
          span.textContent = initials(app.name);
          return span;
        };
        if (!icon) return fallback();
        const img = document.createElement('img');
        img.className = 'app-logo';
        img.alt = '';
        img.src = icon;
        img.addEventListener('error', () => img.replaceWith(fallback()), { once: true });
        return img;
      }

      function render() {
        const admin = isAdmin();
        if (!admin) editing = false;
        grid.classList.toggle('is-editing', editing);
        grid.replaceChildren();
        apps.forEach((app, i) => {
          const cell = document.createElement('div');
          cell.className = 'app-cell';
          cell.dataset.sortId = app.id;
          cell.draggable = admin;
          cell.style.setProperty('--jiggle-delay', (-(i % 3) * 0.11) + 's');
          const a = document.createElement('a');
          a.className = 'app-tile';
          a.draggable = admin;
          const link = linkFor(app);
          a.href = link.href;
          if (link.newTab) { a.target = '_blank'; a.rel = 'noopener'; }
          a.title = app.name;
          a.setAttribute('aria-label', editing ? '編輯 ' + app.name : app.name);
          a.dataset.appId = app.id;
          a.append(logo(app));
          cell.append(a);
          if (admin) {
            const handle = document.createElement('button');
            handle.type = 'button'; handle.className = 'reorder-handle'; handle.textContent = '⠿';
            handle.title = '';
            handle.setAttribute('aria-label', '拖曳排序：' + app.name);
            cell.append(handle);
          }
          if (editing) {
            const rm = document.createElement('button');
            rm.type = 'button';
            rm.className = 'app-remove';
            rm.dataset.removeId = app.id;
            rm.setAttribute('aria-label', '移除 ' + app.name);
            rm.innerHTML = '<span aria-hidden="true"></span>';
            cell.append(rm);
          }
          grid.append(cell);
        });
        const total = Math.max(MIN_SLOTS, Math.ceil((apps.length + (admin && apps.length < MAX_APPS ? 1 : 0)) / 4) * 4);
        for (let i = apps.length; i < total; i++) {
          if (admin) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'app-slot is-admin';
            b.textContent = '+';
            b.title = '新增分站';
            b.setAttribute('aria-label', '新增分站');
            b.dataset.add = '1';
            grid.append(b);
          } else {
            const d = document.createElement('div');
            d.className = 'app-slot';
            d.setAttribute('aria-hidden', 'true');
            d.textContent = '+';
            grid.append(d);
          }
        }
        hint.classList.toggle('hidden', !admin || editing);
        doneBtn.classList.toggle('hidden', !editing);
      }
      function setEditing(on) {
        if (on && !isAdmin()) return;
        if (editing === on) return;
        editing = on;
        if (on && navigator.vibrate) navigator.vibrate(15);
        render();
      }
      doneBtn.addEventListener('click', () => setEditing(false));
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && editing && !document.querySelector('dialog[open]')) setEditing(false); });
      // 點分站區以外的地方結束編輯（和 iPhone 一樣）
      document.addEventListener('pointerdown', e => {
        if (editing && !e.target.closest('#siteGrid, #appsDoneBtn, dialog')) setEditing(false);
      });

      window.clcReorder(grid, {
        item: '.app-cell', grid: true, allowed: () => isAdmin(), start: () => cancelPress(), hold: () => setEditing(true),
        async move(from, to, after) {
          const moving = apps.find(a => a.id === from);
          if (!moving || !apps.some(a => a.id === to)) return;
          const next = apps.filter(a => a.id !== from);
          next.splice(next.findIndex(a => a.id === to) + (after ? 1 : 0), 0, moving);
          await persist(next);
        },
        error: err => alert('排序儲存失敗：' + errorText(err))
      });

      // ---------- 長按進入編輯模式 ----------
      let press = null, suppressClick = false;
      grid.addEventListener('pointerdown', e => {
        if (!isAdmin() || editing || (e.pointerType === 'mouse' && e.button !== 0)) return;
        const target = e.target.closest('.app-cell, .app-slot.is-admin');
        if (!target) return;
        target.classList.add('app-pressing');
        press = {
          target, x: e.clientX, y: e.clientY,
          timer: setTimeout(() => {
            target.classList.remove('app-pressing');
            suppressClick = true;
            press = null;
            setEditing(true);
          }, LONG_PRESS_MS)
        };
      });
      function cancelPress() {
        if (!press) return;
        clearTimeout(press.timer);
        press.target.classList.remove('app-pressing');
        press = null;
      }
      grid.addEventListener('pointermove', e => {
        if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) cancelPress();
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => grid.addEventListener(t, cancelPress));
      // 長按放開後的那一下點擊不算（若瀏覽器沒送出點擊，短時間後自動恢復）
      document.addEventListener('pointerup', () => { if (suppressClick) setTimeout(() => { suppressClick = false; }, 350); });
      grid.addEventListener('click', e => {
        if (suppressClick) { e.preventDefault(); e.stopPropagation(); suppressClick = false; return; }
        const rm = e.target.closest('.app-remove');
        if (rm) { e.preventDefault(); removeApp(rm.dataset.removeId); return; }
        if (e.target.closest('.app-slot.is-admin')) { e.preventDefault(); openAdd(); return; }
        const cell = e.target.closest('.app-cell');
        const tile = cell && cell.querySelector('.app-tile');
        if (tile && editing) { e.preventDefault(); openEdit(tile.dataset.appId); }
      }, true);
      grid.addEventListener('contextmenu', e => { if (isAdmin() && e.target.closest('.app-tile, .app-slot')) e.preventDefault(); });

      // ---------- 儲存 ----------
      async function persist(next) {
        if (!window.db || !window.firebase) throw new Error('資料庫尚未載入');
        await window.db.collection('dx04_settings').doc('apps').set({
          items: next,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedBy: String(window.currentAdminEmail || '')
        });
        apps = next;
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(apps)); } catch (_) {}
        render();
      }
      function errorText(err) {
        return err && err.code === 'permission-denied'
          ? '權限不足：請確認已用管理員登入，並已到 Firebase Console 發布最新的 firestore.rules。'
          : '儲存失敗，請稍後再試。';
      }
      async function removeApp(id) {
        const app = apps.find(a => a.id === id);
        if (!app || !confirm('從總控台移除「' + app.name + '」？')) return;
        try { await persist(apps.filter(a => a.id !== id)); }
        catch (err) { console.warn('分站移除失敗', err); alert(errorText(err)); }
      }
      async function siteInfo(url) {
        try {
          const res = await fetch('/api/site-info?url=' + encodeURIComponent(url));
          const data = await res.json();
          if (data && data.ok) return data;
        } catch (_) {}
        // 讀不到時：名稱用網域，Logo 用 Google 圖示服務
        let host = '';
        try { host = new URL(url).hostname.replace(/^www\./, ''); } catch (_) {}
        return { url, name: host || url, icon: host ? 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(host) + '&sz=128' : '', embeddable: false };
      }

      // ---------- 新增（只要貼網址） ----------
      const addDialog = document.getElementById('appAddDialog');
      const addForm = document.getElementById('appAddForm');
      const addUrl = document.getElementById('appAddUrl');
      const addErr = document.getElementById('appAddError');
      const addBtn = document.getElementById('appAddSaveBtn');
      function showAddError(msg) { addErr.textContent = msg; addErr.classList.toggle('hidden', !msg); }
      function openAdd() {
        if (!isAdmin()) return;
        addUrl.value = '';
        showAddError('');
        addBtn.disabled = false;
        addBtn.textContent = '新增';
        addDialog.showModal();
        addUrl.focus();
      }
      document.getElementById('appAddCancelBtn').addEventListener('click', () => addDialog.close());
      addDialog.addEventListener('click', e => { if (e.target === addDialog) addDialog.close(); });
      addForm.addEventListener('submit', async e => {
        e.preventDefault();
        const url = normalizeInputUrl(addUrl.value);
        if (!url) return showAddError('網址格式不正確，例如 https://example.com');
        if (apps.length >= MAX_APPS) return showAddError('最多 ' + MAX_APPS + ' 個分站。');
        addBtn.disabled = true;
        addBtn.textContent = '讀取中…';
        showAddError('');
        const info = await siteInfo(url);
        const item = {
          id: 'app_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          name: String(info.name || '').slice(0, 30) || url,
          url: safeUrl(info.url) || url,
          icon: safeUrl(info.icon) || '',
          embeddable: info.embeddable === true
        };
        try {
          await persist(apps.concat(item));
          addDialog.close();
        } catch (err) {
          console.warn('分站新增失敗', err);
          showAddError(errorText(err));
          addBtn.disabled = false;
          addBtn.textContent = '新增';
        }
      });

      // ---------- 編輯（編輯模式下點 Logo）：改名稱、換圖示 ----------
      const dialog = document.getElementById('appDialog');
      const form = document.getElementById('appForm');
      const fName = document.getElementById('appName');
      const fUrl = document.getElementById('appUrl');
      const fIcon = document.getElementById('appIcon');
      const preview = document.getElementById('appIconPreview');
      const errEl = document.getElementById('appFormError');
      const saveBtn = document.getElementById('appSaveBtn');
      const refetchBtn = document.getElementById('appRefetchBtn');
      let editingId = null, refetchedEmbeddable = null;
      function showError(msg) { errEl.textContent = msg; errEl.classList.toggle('hidden', !msg); }
      function updatePreview() { preview.replaceChildren(logo({ name: fName.value, icon: fIcon.value })); }
      function openEdit(id) {
        const app = apps.find(a => a.id === id);
        if (!app || !isAdmin()) return;
        editingId = id;
        refetchedEmbeddable = null;
        fName.value = app.name;
        fUrl.value = app.site ? hrefFor(app) : app.url;
        fUrl.readOnly = !!app.site;
        fUrl.title = app.site ? 'YA、SR 的網址跟著 header.js 的 CLC_SITES' : '';
        fIcon.value = app.icon || '';
        updatePreview();
        showError('');
        saveBtn.disabled = false;
        dialog.showModal();
      }
      fIcon.addEventListener('input', updatePreview);
      fName.addEventListener('input', updatePreview);
      refetchBtn.addEventListener('click', async () => {
        const url = fUrl.readOnly ? new URL(fUrl.value, location.href).href : normalizeInputUrl(fUrl.value);
        if (!url) return showError('網址格式不正確。');
        refetchBtn.disabled = true;
        refetchBtn.textContent = '讀取中…';
        const info = await siteInfo(url);
        refetchedEmbeddable = typeof info.embeddable === 'boolean' ? info.embeddable : null;
        if (info.icon) fIcon.value = info.icon;
        if (info.name && !fUrl.readOnly) fName.value = String(info.name).slice(0, 30);
        updatePreview();
        refetchBtn.disabled = false;
        refetchBtn.textContent = '重新抓取';
      });
      document.getElementById('appCancelBtn').addEventListener('click', () => dialog.close());
      dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const old = apps.find(a => a.id === editingId);
        if (!old) return dialog.close();
        const name = fName.value.trim().slice(0, 30);
        const url = old.site ? old.url : normalizeInputUrl(fUrl.value);
        const icon = safeUrl(fIcon.value);
        if (!name) return showError('請輸入名稱。');
        if (!url) return showError('網址格式不正確。');
        if (fIcon.value.trim() && !icon) return showError('圖示網址格式不正確。');
        saveBtn.disabled = true;
        try {
          const patch = { name, url, icon };
          if (refetchedEmbeddable !== null && !old.site) patch.embeddable = refetchedEmbeddable;
          else if (url !== old.url) delete old.embeddable;
          await persist(apps.map(a => a.id === old.id ? Object.assign({}, old, patch) : a));
          dialog.close();
        } catch (err) {
          console.warn('分站儲存失敗', err);
          showError(errorText(err));
          saveBtn.disabled = false;
        }
      });

      // ---------- 讀取 ----------
      render();
      checkEmbeds();
      window.addEventListener('clc-admin-changed', render);
      try {
        window.db.collection('dx04_settings').doc('apps').onSnapshot(snap => {
          const items = snap.exists && Array.isArray(snap.data().items) ? snap.data().items : DEFAULT_APPS;
          apps = items.filter(a => a && a.id && a.name);
          try { localStorage.setItem(CACHE_KEY, JSON.stringify(apps)); } catch (_) {}
          render();
          checkEmbeds();
        }, err => console.warn('分站清單讀取失敗（沿用快取或預設）', err));
      } catch (err) {
        console.warn('分站清單無法連線資料庫', err);
      }
    })();
  </script>
  <script>
    // 安裝事件須在登入前監聽，避免錯過 beforeinstallprompt 與 window.load。
    // PWA 安裝（與 YA 首頁相同做法）
    const pwaDisplayMode = window.matchMedia('(display-mode: standalone)');
    let deferredPrompt = null;
    let pwaInstalledInSession = false;
    let pwaInstallPromptPending = false;
    let pwaInstallHelp = null;
    let pwaInstallPreviousFocus = null;
    let pwaInstallHelpRequest = 0;
    // 已安裝記號：從 App 開啟或安裝完成時記下，之後在一般分頁也隱藏「安裝」。
    // Chrome 再次提示可安裝（beforeinstallprompt）代表已解除安裝，會清除記號。
    const PWA_INSTALLED_KEY = 'clc_dx04_installed';
    let pwaKnownInstalled = false;
    try { pwaKnownInstalled = localStorage.getItem(PWA_INSTALLED_KEY) === '1'; } catch (_) {}
    function setPwaKnownInstalled(value) {
      pwaKnownInstalled = value;
      try { value ? localStorage.setItem(PWA_INSTALLED_KEY, '1') : localStorage.removeItem(PWA_INSTALLED_KEY); } catch (_) {}
    }

    function isPwaStandalone() {
      return pwaDisplayMode.matches || window.navigator.standalone === true;
    }

    function checkPwaInstalledState() {
      const btn = document.getElementById('installAppBtn');
      if (!btn) return;
      if (isPwaStandalone() && !pwaKnownInstalled) setPwaKnownInstalled(true);
      const installed = isPwaStandalone() || pwaInstalledInSession;
      btn.hidden = installed;
      btn.classList.toggle('hidden', installed);
      btn.style.display = installed ? 'none' : '';
      btn.disabled = pwaInstallPromptPending;
      if (pwaInstallPromptPending) btn.setAttribute('aria-busy', 'true');
      else btn.removeAttribute('aria-busy');
      if (installed) closePwaInstallHelp();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW 失敗', err));
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (pwaKnownInstalled) setPwaKnownInstalled(false);
      const btn = document.getElementById('installAppBtn');
      if (btn) {
        btn.classList.add('bg-[#007E8A]/15', 'border-[#007E8A]/50', 'text-[#007E8A]', 'dark:text-teal-300');
      }
      checkPwaInstalledState();
    });

    window.addEventListener('appinstalled', () => {
      pwaInstalledInSession = true;
      setPwaKnownInstalled(true);
      deferredPrompt = null;
      checkPwaInstalledState();
    });

    async function pwaInstallInstructions() {
      const ua = navigator.userAgent;
      const isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        return [
          '使用 Safari 開啟目前這個 DX04 網址。',
          '點選 Safari 的「分享」按鈕，再選擇「加入主畫面」。',
          '確認名稱後點選「新增」，之後即可從主畫面開啟 CLC DX04。'
        ];
      }
      if (/Android/i.test(ua)) {
        return [
          '使用 Android Chrome 開啟目前這個 DX04 網址。',
          '點選右上角「⋮」選單，選擇「安裝應用程式」或「加入主畫面」。',
          '依畫面指示確認；完成後從主畫面或應用程式清單開啟 CLC DX04。'
        ];
      }
      let isBrave = false;
      try {
        isBrave = !!(navigator.brave && typeof navigator.brave.isBrave === 'function' &&
          await navigator.brave.isBrave());
      } catch (_) { /* 無法辨識時使用一般瀏覽器操作說明。 */ }
      if (isBrave) {
        return [
          '在 Brave 網址列右側尋找安裝圖示；或開啟右上角主選單，尋找「安裝 CLC DX04」或「安裝應用程式」。',
          '安裝項目可能位於「儲存與分享」或「投放、儲存與分享」子選單。',
          '若選單沒有安裝項目，可使用 Chrome 或 Edge 開啟目前這個 DX04 網址安裝。'
        ];
      }
      if (/Edg\//.test(ua)) {
        return [
          '在 Edge 網址列右側點選安裝圖示；或開啟右上角「⋯」選單。',
          '選擇「應用程式」→「將此網站安裝為應用程式」，再依畫面指示確認。',
          '完成後，從桌面或應用程式清單開啟 CLC DX04。'
        ];
      }
      if (/Chrome\//.test(ua)) {
        return [
          '在 Chrome 網址列右側點選安裝圖示；或開啟右上角「⋮」選單。',
          '尋找「安裝 CLC DX04」或「安裝網頁為應用程式」；安裝項目可能位於「投放、儲存與分享」內。',
          '依畫面指示確認後，從桌面或應用程式清單開啟 CLC DX04。'
        ];
      }
      return [
        '在目前瀏覽器的網址列或右上角選單，尋找「安裝應用程式」或「加入主畫面」。',
        '若沒有安裝項目，可使用 Chrome 或 Edge 開啟目前這個 DX04 網址安裝。'
      ];
    }

    function closePwaInstallHelp() {
      pwaInstallHelpRequest += 1;
      if (!pwaInstallHelp || pwaInstallHelp.style.display === 'none') return;
      pwaInstallHelp.style.display = 'none';
      document.removeEventListener('keydown', handlePwaInstallHelpKeydown, true);
      const previous = pwaInstallPreviousFocus;
      pwaInstallPreviousFocus = null;
      if (previous && previous.isConnected && !previous.hidden && !previous.disabled) previous.focus();
    }

    function handlePwaInstallHelpKeydown(event) {
      if (event.key === 'Escape') {
        event.preventDefault();
        event.stopImmediatePropagation();
        closePwaInstallHelp();
      } else if (event.key === 'Tab') {
        event.stopImmediatePropagation();
        const buttons = pwaInstallHelp.querySelectorAll('button');
        const first = buttons[0];
        const last = buttons[buttons.length - 1];
        if (event.shiftKey && (document.activeElement === first || !pwaInstallHelp.contains(document.activeElement))) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && (document.activeElement === last || !pwaInstallHelp.contains(document.activeElement))) {
          event.preventDefault();
          first.focus();
        }
      }
    }

    function createPwaInstallHelp() {
      const overlay = document.createElement('div');
      overlay.id = 'pwaInstallHelpOverlay';
      overlay.style.cssText = 'display:none;position:fixed;inset:0;z-index:2147483646;padding:16px;box-sizing:border-box;background:rgba(0,0,0,.7);align-items:center;justify-content:center;';
      overlay.innerHTML = `
        <section id="pwaInstallHelpDialog" role="dialog" aria-modal="true" aria-labelledby="pwaInstallHelpTitle" aria-describedby="pwaInstallHelpSummary pwaInstallHelpReason" style="box-sizing:border-box;width:100%;max-width:460px;max-height:calc(100% - 16px);overflow:auto;overscroll-behavior:contain;padding:24px;border:1px solid rgba(255,255,255,.15);border-radius:18px;background:#11131b;color:#f1f5f9;box-shadow:0 24px 70px rgba(0,0,0,.45);font:15px/1.7 system-ui,sans-serif;text-align:left;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
            <h2 id="pwaInstallHelpTitle" style="margin:0;font-size:20px;font-weight:800;">安裝 CLC DX04</h2>
            <button id="pwaInstallHelpClose" type="button" aria-label="關閉安裝說明" style="flex:none;width:36px;height:36px;border:1px solid #64748b;border-radius:9px;background:transparent;color:#f1f5f9;cursor:pointer;font-size:20px;">×</button>
          </div>
          <p id="pwaInstallHelpSummary" style="margin:16px 0 0;">目前瀏覽器未提供直接安裝提示。</p>
          <p id="pwaInstallHelpReason" style="display:none;margin:8px 0 0;color:#fde68a;"></p>
          <ol id="pwaInstallHelpSteps" style="margin:16px 0;padding-left:24px;list-style:decimal;"></ol>
          <p style="margin:0 0 20px;color:#cbd5e1;font-size:13px;">若已經安裝，請從桌面或應用程式清單開啟 CLC DX04。</p>
          <button id="pwaInstallHelpDone" type="button" style="width:100%;min-height:44px;padding:10px 16px;border:0;border-radius:10px;background:#007e8a;color:white;cursor:pointer;font-size:15px;font-weight:700;">知道了</button>
        </section>`;
      overlay.querySelector('#pwaInstallHelpClose').addEventListener('click', closePwaInstallHelp);
      overlay.querySelector('#pwaInstallHelpDone').addEventListener('click', closePwaInstallHelp);
      overlay.addEventListener('click', event => {
        if (event.target === overlay) closePwaInstallHelp();
      });
      document.body.appendChild(overlay);
      pwaInstallHelp = overlay;
    }

    async function openPwaInstallHelp(reason = '') {
      const request = ++pwaInstallHelpRequest;
      const steps = await pwaInstallInstructions();
      if (request !== pwaInstallHelpRequest || isPwaStandalone() || pwaInstalledInSession) return;
      if (!pwaInstallHelp) createPwaInstallHelp();
      const list = pwaInstallHelp.querySelector('#pwaInstallHelpSteps');
      list.replaceChildren();
      steps.forEach(text => {
        const item = document.createElement('li');
        item.textContent = text;
        item.style.marginBottom = '8px';
        list.appendChild(item);
      });
      const reasonElement = pwaInstallHelp.querySelector('#pwaInstallHelpReason');
      reasonElement.textContent = reason;
      reasonElement.style.display = reason ? '' : 'none';
      pwaInstallHelp.querySelector('#pwaInstallHelpSummary').textContent = reason
        ? '這次未能完成直接安裝，仍可使用下方方式操作。'
        : '目前瀏覽器未提供直接安裝提示。';
      if (pwaInstallHelp.style.display === 'none') pwaInstallPreviousFocus = document.activeElement;
      pwaInstallHelp.style.display = 'flex';
      document.addEventListener('keydown', handlePwaInstallHelpKeydown, true);
      pwaInstallHelp.querySelector('#pwaInstallHelpClose').focus();
    }

    window.triggerPwaInstall = async function() {
      if (isPwaStandalone() || pwaInstalledInSession) {
        checkPwaInstalledState();
        return;
      }
      if (pwaInstallPromptPending) return;
      if (!deferredPrompt) {
        await openPwaInstallHelp();
        return;
      }
      closePwaInstallHelp();
      const promptEvent = deferredPrompt;
      deferredPrompt = null;
      pwaInstallPromptPending = true;
      checkPwaInstalledState();
      try {
        // 在使用者的點擊內立即呼叫；同一份原生提示僅能使用一次。
        const result = await promptEvent.prompt();
        const choice = result && typeof result.outcome === 'string'
          ? result : await promptEvent.userChoice;
        // 使用者取消是正常選擇；只有 appinstalled 才判定本次確實安裝完成。
        if (choice && choice.outcome === 'dismissed') return;
      } catch (err) {
        console.warn('安裝提示未能開啟:', err);
        let reason = '這次安裝提示未能開啟，請使用瀏覽器選單安裝，或稍後再試。';
        if (err && err.name === 'NotAllowedError') {
          reason = '瀏覽器目前不允許開啟直接安裝提示，請使用下方選單方式安裝。';
        } else if (err && err.name === 'InvalidStateError') {
          reason = '這次安裝提示已失效，請使用下方選單方式安裝，或稍後再試。';
        } else if (err && err.name === 'AbortError') {
          reason = '這次安裝已取消；你可以稍後再試，或使用下方方式安裝。';
        }
        await openPwaInstallHelp(reason);
      } finally {
        pwaInstallPromptPending = false;
        checkPwaInstalledState();
      }
    };

    if (typeof pwaDisplayMode.addEventListener === 'function') {
      pwaDisplayMode.addEventListener('change', checkPwaInstalledState);
    } else if (typeof pwaDisplayMode.addListener === 'function') {
      pwaDisplayMode.addListener(checkPwaInstalledState);
    }
    checkPwaInstalledState();
    document.addEventListener('DOMContentLoaded', checkPwaInstalledState);
    // 支援的瀏覽器（Chrome／Edge）直接詢問系統是否已安裝，只查一次。
    if (!isPwaStandalone() && typeof navigator.getInstalledRelatedApps === 'function') {
      navigator.getInstalledRelatedApps().then(apps => {
        // 只採用「已安裝」的結果；部分平台不支援偵測會回傳空清單，不據此判定未安裝。
        if (Array.isArray(apps) && apps.length > 0) { pwaInstalledInSession = true; setPwaKnownInstalled(true); }
        checkPwaInstalledState();
      }).catch(() => {});
    }
  </script>
</body>
</html>
