  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"CLC Arial"', 'Arial', '"Microsoft JhengHei"', 'sans-serif'],
          },
          colors: {
            brand: {
              teal: '#007E8A',
              tealHover: '#006C77',
              surface: '#11131B',
              card: '#161924',
              border: 'rgba(255, 255, 255, 0.1)',

            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  

  <style>
    html { font-size: 16px; }
    @media (min-width: 1024px) { html { font-size: 19px; } }
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    /* 待辦勾選圈與 App 格子 */
    .todo-item { display:flex; align-items:flex-start; gap:14px; min-height:44px; padding:8px 4px; cursor:pointer; }
    .todo-text { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
    .todo-title { font-size:1rem; color:#0f172a; }
    .dark .todo-title { color:#fff; }
    .todo-meta { font-size:0.8125rem; color:#64748b; }
    .dark .todo-meta { color:#8A92A6; }
    .todo-ck { appearance:none; -webkit-appearance:none; flex:none; width:22px; height:22px; margin-top:1px; border-radius:50%; border:2px solid #94a3b8; display:grid; place-content:center; cursor:pointer; background:transparent; transition:all .15s; }
    .dark .todo-ck { border-color:#4B5263; }
    .todo-ck.p1, .dark .todo-ck.p1 { border-color:#FB923C; }
    .todo-ck:checked, .dark .todo-ck:checked { background:#007E8A; border-color:#007E8A; }
    .todo-ck:checked::after { content:""; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:translateY(-1px) rotate(45deg); }
    .todo-ck:focus-visible { outline:2px solid #00A3B4; outline-offset:2px; }
    .todo-item:has(.todo-ck:checked) .todo-title { text-decoration:line-through; opacity:.5; }
    .app-tile { aspect-ratio:1; display:block; border-radius:22%; transition:transform .2s; }
    .app-tile:hover { transform:scale(1.05); }
    .app-tile:active { transform:scale(.95); }
    .app-tile:focus-visible { outline:2px solid #00A3B4; outline-offset:3px; }
    .app-logo, .app-fallback { display:block; width:100%; height:100%; border-radius:22%; object-fit:cover; }
    .app-fallback { display:grid; place-content:center; background:#007E8A; color:#fff; font-weight:800; font-size:1.5rem; }
    .app-slot { aspect-ratio:1; border-radius:22%; border:2px dashed #cbd5e1; color:#94a3b8; display:grid; place-content:center; font-size:1.75rem; font-weight:300; user-select:none; }
    .dark .app-slot { border-color:#334155; color:#475569; }
    /* 首頁區塊：電腦固定位置；手機依 DOM 順序，可拖曳 */
    @media (min-width: 1024px) {
      #dashGrid > [data-widget="todo"] { grid-column: 1; grid-row: 1 / span 2; }
      #dashGrid > [data-widget="apps"] { grid-column: 2; grid-row: 1; }
      #dashGrid > [data-widget="clock"] { grid-column: 2; grid-row: 2; }
    }
    .dash-widget { position:relative; }
    .drag-handle { position:absolute; top:0; left:50%; transform:translateX(-50%); width:56px; height:22px; display:flex; align-items:center; justify-content:center; background:none; border:0; padding:0; cursor:grab; touch-action:none; z-index:2; }
    .drag-handle span { width:36px; height:5px; border-radius:9999px; background:#cbd5e1; }
    .dark .drag-handle span { background:#334155; }
    .drag-handle:focus-visible { outline:2px solid #00A3B4; border-radius:8px; }
    .dash-widget.is-dragging { z-index:30; box-shadow:0 18px 40px rgba(0,0,0,.35); transition:none; }
    .dash-widget.is-dragging .drag-handle { cursor:grabbing; }
    .dash-widget.is-dragging .drag-handle span { background:#007E8A; }
    .dash-widget.is-dragging[data-widget="apps"] { background:#fff; border-radius:24px; }
    .dark .dash-widget.is-dragging[data-widget="apps"] { background:#161924; }
    body.dash-dragging { user-select:none; -webkit-user-select:none; }
    .app-tile { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
    .app-tile img { pointer-events:none; }
    .app-slot.is-admin { cursor:pointer; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
    .app-slot.is-admin:hover { border-color:#007E8A; color:#007E8A; }
    .app-pressing { transform:scale(.92) !important; transition:transform .5s; }
    .app-dialog::backdrop { background:rgba(0,0,0,.6); }
    .app-input { height:44px; padding:0 14px; border-radius:12px; font-weight:400; font-size:15px; background:#f1f5f9; border:1px solid #e2e8f0; color:inherit; outline:none; }
    .dark .app-input { background:rgba(255,255,255,.04); border-color:rgba(255,255,255,.1); }
    .app-input:focus { border-color:#007E8A; }
    .app-input[readonly] { opacity:.6; }
  </style>

  <!-- 深淺主題預載防閃爍（與 YA 相同） -->
  <script>
    (function () {
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      function savedTheme() {
        const value = localStorage.getItem('theme');
        return value === 'light' || value === 'dark' ? value : null;
      }
      function applyTheme() {
        const chosen = savedTheme();
        document.documentElement.classList.toggle('dark', chosen ? chosen === 'dark' : systemTheme.matches);
      }
      applyTheme();
      function onSystemThemeChange() {
        if (!savedTheme()) applyTheme();
      }
      if (typeof systemTheme.addEventListener === 'function') {
        systemTheme.addEventListener('change', onSystemThemeChange);
      } else if (typeof systemTheme.addListener === 'function') {
        systemTheme.addListener(onSystemThemeChange);
      }
    })();
  </script>
</head>

  <!-- 分站新增／編輯（僅管理員） -->

  <script>
    // 手機版區塊拖曳排序（Pointer 事件，觸控與滑鼠皆可），順序存在 localStorage
    (function () {
      const grid = document.getElementById('dashGrid');
      const KEY = 'clc_dx04_widget_order';
      const widgets = () => Array.from(grid.querySelectorAll(':scope > [data-widget]'));
      try {
        const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (Array.isArray(saved)) saved.forEach(k => { const el = grid.querySelector(':scope > [data-widget="' + k + '"]'); if (el) grid.appendChild(el); });
      } catch (_) {}
      function save() {
        try { localStorage.setItem(KEY, JSON.stringify(widgets().map(w => w.dataset.widget))); } catch (_) {}
      }
      let drag = null;
      // 以「頁面座標」計算位移，捲動時區塊仍跟著手指
      function update() {
        if (!drag) return;
        const el = drag.el;
        const pageY = drag.clientY + window.scrollY;
        const dy = () => pageY - drag.startPageY + drag.base;
        el.style.transform = 'translateY(' + dy() + 'px)';
        const list = widgets();
        const i = list.indexOf(el);
        const prev = list[i - 1], next = list[i + 1];
        const naturalTop = el.getBoundingClientRect().top - dy();
        let moved = false;
        if (next) { const r = next.getBoundingClientRect(); if (drag.clientY > r.top + r.height / 2) { grid.insertBefore(next, el); moved = true; } }
        if (!moved && prev) { const r = prev.getBoundingClientRect(); if (drag.clientY < r.top + r.height / 2) { grid.insertBefore(el, prev); moved = true; } }
        if (moved) {
          el.style.transform = '';
          drag.base += naturalTop - el.getBoundingClientRect().top;
          el.style.transform = 'translateY(' + dy() + 'px)';
        }
      }
      function autoScroll() {
        if (!drag) return;
        const edge = 70, y = drag.clientY;
        let v = 0;
        if (y < edge) v = -Math.ceil((edge - y) / 5);
        else if (y > window.innerHeight - edge) v = Math.ceil((y - (window.innerHeight - edge)) / 5);
        if (v) { window.scrollBy(0, v); update(); }
        drag.raf = requestAnimationFrame(autoScroll);
      }
      grid.addEventListener('pointerdown', e => {
        const handle = e.target.closest('.drag-handle');
        if (!handle || window.matchMedia('(min-width: 1024px)').matches) return;
        e.preventDefault();
        const el = handle.closest('[data-widget]');
        drag = { el, id: e.pointerId, clientY: e.clientY, startPageY: e.clientY + window.scrollY, base: 0, raf: 0 };
        handle.setPointerCapture(e.pointerId);
        el.classList.add('is-dragging');
        document.body.classList.add('dash-dragging');
        drag.raf = requestAnimationFrame(autoScroll);
      });
      grid.addEventListener('pointermove', e => {
        if (!drag || e.pointerId !== drag.id) return;
        drag.clientY = e.clientY;
        update();
      });
      function end(e) {
        if (!drag || e.pointerId !== drag.id) return;
        cancelAnimationFrame(drag.raf);
        drag.el.classList.remove('is-dragging');
        drag.el.style.transform = '';
        document.body.classList.remove('dash-dragging');
        drag = null;
        save();
      }
      grid.addEventListener('pointerup', end);
      grid.addEventListener('pointercancel', end);
      // 鍵盤：焦點在拖曳把手時，上下鍵移動
      grid.addEventListener('keydown', e => {
        const handle = e.target.closest('.drag-handle');
        if (!handle || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
        e.preventDefault();
        const el = handle.closest('[data-widget]');
        if (e.key === 'ArrowUp' && el.previousElementSibling) grid.insertBefore(el, el.previousElementSibling);
        if (e.key === 'ArrowDown' && el.nextElementSibling) grid.insertBefore(el.nextElementSibling, el);
        handle.focus();
        save();
      });
    })();

    // 時鐘與日期（台北時間）：以 Cloudflare 伺服器時間校正，不受本機時鐘誤差影響
    (function () {
      const timeEl = document.getElementById('clockTime');
      const secEl = document.getElementById('clockSec');
      const dateEl = document.getElementById('clockDate');
      const tz = 'Asia/Taipei';
      const fmtTime = new Intl.DateTimeFormat('zh-TW', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
      const fmtDate = new Intl.DateTimeFormat('zh-TW', { timeZone: tz, year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      let offset = 0; // 伺服器時間 − 本機時間（毫秒）
      async function syncTime() {
        try {
          const t0 = Date.now();
          const res = await fetch('/favicon.svg?t=' + t0, { method: 'HEAD', cache: 'no-store' });
          const t1 = Date.now();
          const server = Date.parse(res.headers.get('date'));
          if (!isNaN(server)) offset = server + 500 - (t0 + t1) / 2; // Date 只到秒，補半秒
        } catch (_) { /* 連不到時沿用本機時間 */ }
      }
      function tick() {
        const now = new Date(Date.now() + offset);
        const parts = Object.fromEntries(fmtTime.formatToParts(now).map(p => [p.type, p.value]));
        timeEl.textContent = parts.hour + ':' + parts.minute;
        secEl.textContent = ':' + parts.second;
        dateEl.textContent = fmtDate.format(now);
        setTimeout(tick, 1000 - (now.getTime() % 1000) + 5);
      }
      tick();
      syncTime();
      setInterval(syncTime, 10 * 60 * 1000);
    })();

    // 天氣：Open-Meteo（免金鑰），位置為板橋，每 30 分鐘更新
    (function () {
      const LAT = 25.0143, LON = 121.4672, PLACE = '板橋';
      const icons = {
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
        partly: '<path d="M8 3v1.5M3.5 8H2M4.8 4.8l1 1M12.5 5.5A4 4 0 0 0 5 8.5"/><path d="M8 20h9a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 8 20z"/>',
        cloud: '<path d="M7 19h10a4.5 4.5 0 0 0 .6-9 6 6 0 0 0-11.6 1.7A3.7 3.7 0 0 0 7 19z"/>',
        fog: '<path d="M7 14h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 14zM4 18h16M7 21h10"/>',
        rain: '<path d="M7 15h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 15zM8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
        storm: '<path d="M7 14h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 14zM12 15l-2 4h4l-2 4"/>'
      };
      function describe(code) {
        if (code === 0) return ['晴', 'sun'];
        if (code <= 2) return ['晴時多雲', 'partly'];
        if (code === 3) return ['陰', 'cloud'];
        if (code <= 48) return ['有霧', 'fog'];
        if (code <= 57) return ['毛毛雨', 'rain'];
        if (code <= 67) return ['雨', 'rain'];
        if (code <= 77) return ['雪', 'cloud'];
        if (code <= 82) return ['陣雨', 'rain'];
        return ['雷雨', 'storm'];
      }
      function setIcon(name) {
        document.getElementById('wxIcon').innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full" aria-hidden="true">' + icons[name] + '</svg>';
      }
      async function load() {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
          '&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m' +
          '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=1&timezone=Asia%2FTaipei';
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(res.status);
          const d = await res.json();
          const c = d.current, day = d.daily;
          const [text, icon] = describe(c.weather_code);
          setIcon(icon);
          document.getElementById('wxTemp').textContent = Math.round(c.temperature_2m) + '°';
          document.getElementById('wxDesc').textContent = text;
          document.getElementById('wxMeta').textContent =
            PLACE + ' · 高 ' + Math.round(day.temperature_2m_max[0]) + '° 低 ' + Math.round(day.temperature_2m_min[0]) +
            '° · 降雨 ' + (day.precipitation_probability_max[0] ?? 0) + '% · 濕度 ' + c.relative_humidity_2m + '%';
        } catch (err) {
          console.warn('天氣讀取失敗', err);
          setIcon('cloud');
          document.getElementById('wxDesc').textContent = '天氣暫時無法讀取，稍後重試';
          setTimeout(load, 2 * 60 * 1000);
        }
      }
      load();
      setInterval(load, 30 * 60 * 1000);
    })();

    // 待辦（暫時只在畫面上，重新整理會恢復）
    (function () {
      const openEl = document.getElementById('todoOpenCount');
      const doneEl = document.getElementById('todoDoneCount');
      const baseDone = 2;
      function recount() {
        const all = document.querySelectorAll('.todo-ck');
        const checked = document.querySelectorAll('.todo-ck:checked').length;
        openEl.textContent = all.length - checked;
        doneEl.textContent = baseDone + checked;
      }
      document.addEventListener('change', e => { if (e.target.classList.contains('todo-ck')) recount(); });
      document.getElementById('todoAddForm').addEventListener('submit', e => {
        e.preventDefault();
        const input = document.getElementById('todoAddInput');
        const text = input.value.trim();
        if (!text) return;
        const li = document.createElement('li');
        const label = document.createElement('label'); label.className = 'todo-item';
        const ck = document.createElement('input'); ck.type = 'checkbox'; ck.className = 'todo-ck';
        const wrap = document.createElement('span'); wrap.className = 'todo-text';
        const title = document.createElement('span'); title.className = 'todo-title'; title.textContent = text;
        const meta = document.createElement('span'); meta.className = 'todo-meta'; meta.textContent = '今天 · 個人';
        wrap.append(title, meta); label.append(ck, wrap); li.append(label);
        document.getElementById('todoToday').append(li);
        input.value = '';
        recount();
      });
    })();

  <script>
    // 分站入口：清單存在 Firestore dx04_settings/apps（所有裝置共用），本機另存一份快取讓畫面先出來。
    // 管理員（admin／superuser）：長按「＋」新增；長按 Logo 編輯或移除。YA、SR 也一樣可以移除。
    // 開啟方式：YA、SR 用 CLC_SITES 網址（和左上角 Logo 站台選單相同）；其他網站在 DX04 Header 底下的 app.html 內開啟。
    (function () {
      const grid = document.getElementById('siteGrid');
      const hint = document.getElementById('appsAdminHint');
      const CACHE_KEY = 'clc_dx04_apps';
      const MIN_SLOTS = 8, MAX_APPS = 40, LONG_PRESS_MS = 550;
      const DEFAULT_APPS = [
        { id: 'ya', site: 'ya', name: 'CLC YA', url: 'https://clc-dx04.pages.dev/ya/', icon: '/ya/apple-touch-icon.png' },
        { id: 'sr', site: 'sr', name: 'CLC SR', url: 'https://clc-dx04.pages.dev/sr/', icon: '/sr/apple-touch-icon.png' }
      ];
      let apps = DEFAULT_APPS;
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (Array.isArray(cached)) apps = cached;
      } catch (_) {}

      const isAdmin = () => !!window.isAdmin;
      // 只接受 http(s) 或站內路徑，避免 javascript: 之類的連結。
      function safeUrl(value) {
        const v = String(value || '').trim();
        if (!v) return '';
        if (v.startsWith('/') && !v.startsWith('//')) return v;
        try { const u = new URL(v); return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : ''; } catch (_) { return ''; }
      }
      function isSameSite(url) {
        try {
          const u = new URL(url, location.href);
          return u.origin === location.origin || u.hostname === 'clc-dx04.pages.dev';
        } catch (_) { return false; }
      }
      function hrefFor(app) {
        const site = app.site && (window.CLC_SITES || []).find(s => s.key === app.site);
        if (site) return site.url;
        const url = safeUrl(app.url);
        if (!url) return '#';
        return isSameSite(url) ? url : '/app.html?id=' + encodeURIComponent(app.id);
      }
      function initials(name) {
        const n = String(name || '').replace(/^CLC\s+/i, '').trim();
        return (n.slice(0, 2) || '?').toUpperCase();
      }
      function fallback(app) {
        const span = document.createElement('span');
        span.className = 'app-fallback';
        span.textContent = initials(app.name);
        return span;
      }

      function render() {
        const admin = isAdmin();
        grid.replaceChildren();
        apps.forEach(app => {
          const a = document.createElement('a');
          a.className = 'app-tile';
          a.draggable = false;
          a.href = hrefFor(app);
          a.title = app.name;
          a.setAttribute('aria-label', app.name);
          a.dataset.appId = app.id;
          const icon = safeUrl(app.icon);
          if (icon) {
            const img = document.createElement('img');
            img.className = 'app-logo';
            img.alt = '';
            img.src = icon;
            img.addEventListener('error', () => img.replaceWith(fallback(app)), { once: true });
            a.append(img);
          } else {
            a.append(fallback(app));
          }
          grid.append(a);
        });
        const total = Math.max(MIN_SLOTS, Math.ceil((apps.length + (admin && apps.length < MAX_APPS ? 1 : 0)) / 4) * 4);
        for (let i = apps.length; i < total; i++) {
          if (admin) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'app-slot is-admin';
            b.textContent = '+';
            b.title = '長按新增分站';
            b.setAttribute('aria-label', '新增分站（長按或按 Enter）');
            b.dataset.add = '1';
            grid.append(b);
          } else {
            const d = document.createElement('div');
            d.className = 'app-slot';
            d.setAttribute('aria-hidden', 'true');
            d.textContent = '+';
            grid.append(d);
          }
        }
        hint.classList.toggle('hidden', !admin);
      }

      // ---------- 長按 ----------
      let press = null, suppressClick = false;
      grid.addEventListener('pointerdown', e => {
        if (!isAdmin() || (e.pointerType === 'mouse' && e.button !== 0)) return;
        const target = e.target.closest('.app-tile, .app-slot.is-admin');
        if (!target) return;
        target.classList.add('app-pressing');
        press = {
          target, x: e.clientX, y: e.clientY,
          timer: setTimeout(() => {
            target.classList.remove('app-pressing');
            suppressClick = true;
            if (navigator.vibrate) navigator.vibrate(15);
            openDialog(target.dataset.appId || null);
            press = null;
          }, LONG_PRESS_MS)
        };
      });
      function cancelPress() {
        if (!press) return;
        clearTimeout(press.timer);
        press.target.classList.remove('app-pressing');
        press = null;
      }
      grid.addEventListener('pointermove', e => {
        if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) cancelPress();
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => grid.addEventListener(t, cancelPress));
      grid.addEventListener('click', e => {
        if (suppressClick) { e.preventDefault(); e.stopPropagation(); suppressClick = false; return; }
        const add = e.target.closest('.app-slot.is-admin');
        // 鍵盤按 Enter／空白鍵（沒有指標位置）時直接開新增
        if (add && e.detail === 0) openDialog(null);
      }, true);
      grid.addEventListener('contextmenu', e => { if (isAdmin() && e.target.closest('.app-tile, .app-slot')) e.preventDefault(); });

      // ---------- 新增／編輯視窗 ----------
      const dialog = document.getElementById('appDialog');
      const form = document.getElementById('appForm');
      const fName = document.getElementById('appName');
      const fUrl = document.getElementById('appUrl');
      const fIcon = document.getElementById('appIcon');
      const errEl = document.getElementById('appFormError');
      const delBtn = document.getElementById('appDeleteBtn');
      const saveBtn = document.getElementById('appSaveBtn');
      let editingId = null;
      function showError(msg) { errEl.textContent = msg; errEl.classList.toggle('hidden', !msg); }
      function openDialog(id) {
        if (!isAdmin()) return;
        editingId = id;
        const app = id ? apps.find(a => a.id === id) : null;
        document.getElementById('appDialogTitle').textContent = app ? '編輯分站' : '新增分站';
        fName.value = app ? app.name : '';
        fUrl.value = app ? (app.site ? hrefFor(app) : app.url) : '';
        fIcon.value = app ? (app.icon || '') : '';
        fUrl.readOnly = !!(app && app.site);
        fUrl.title = fUrl.readOnly ? 'YA、SR 的網址跟著 header.js 的 CLC_SITES' : '';
        delBtn.classList.toggle('hidden', !app);
        showError('');
        saveBtn.disabled = false;
        dialog.showModal();
        fName.focus();
      }
      document.getElementById('appCancelBtn').addEventListener('click', () => dialog.close());
      dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });

      async function persist(next) {
        if (!window.db || !window.firebase) throw new Error('資料庫尚未載入');
        await window.db.collection('dx04_settings').doc('apps').set({
          items: next,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedBy: String(window.currentAdminEmail || '')
        });
        apps = next;
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(apps)); } catch (_) {}
        render();
      }
      function errorText(err) {
        return err && err.code === 'permission-denied'
          ? '權限不足：請確認已用管理員登入，並已到 Firebase Console 發布最新的 firestore.rules。'
          : '儲存失敗，請稍後再試。';
      }
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const name = fName.value.trim();
        const old = editingId ? apps.find(a => a.id === editingId) : null;
        let url = (old && old.site) ? old.url : safeUrl(fUrl.value);
        if (!url && /^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(fUrl.value.trim())) url = safeUrl('https://' + fUrl.value.trim());
        if (!name) return showError('請輸入名稱。');
        if (!url) return showError('網址格式不正確（需以 https:// 開頭）。');
        let icon = safeUrl(fIcon.value);
        if (fIcon.value.trim() && !icon) return showError('Logo 圖片網址格式不正確。');
        if (!icon && !old) {
          try { icon = new URL(url, location.href).origin + '/apple-touch-icon.png'; } catch (_) {}
        }
        const item = Object.assign({}, old || { id: 'app_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }, { name, url, icon });
        const next = old ? apps.map(a => a.id === old.id ? item : a) : apps.concat(item).slice(0, MAX_APPS);
        saveBtn.disabled = true;
        try {
          await persist(next);
          dialog.close();
        } catch (err) {
          console.warn('分站儲存失敗', err);
          showError(errorText(err));
          saveBtn.disabled = false;
        }
      });
      delBtn.addEventListener('click', async () => {
        const app = apps.find(a => a.id === editingId);
        if (!app || !confirm('確定從總控台移除「' + app.name + '」？')) return;
        try {
          await persist(apps.filter(a => a.id !== app.id));
          dialog.close();
        } catch (err) {
          console.warn('分站移除失敗', err);
          showError(errorText(err));
        }
      });

      // ---------- 讀取 ----------
      render();
      window.addEventListener('clc-admin-changed', render);
      try {
        window.db.collection('dx04_settings').doc('apps').onSnapshot(snap => {
          const items = snap.exists && Array.isArray(snap.data().items) ? snap.data().items : DEFAULT_APPS;
          apps = items.filter(a => a && a.id && a.name);
          try { localStorage.setItem(CACHE_KEY, JSON.stringify(apps)); } catch (_) {}
          render();
        }, err => console.warn('分站清單讀取失敗（沿用快取或預設）', err));
      } catch (err) {
        console.warn('分站清單無法連線資料庫', err);
      }
    })();
  </script>
  <script>
    // PWA 安裝（與 YA 首頁相同做法）
    const pwaDisplayMode = window.matchMedia('(display-mode: standalone)');
    let deferredPrompt = null;
    let pwaInstalledInSession = false;
    let pwaInstallPromptPending = false;
    let pwaInstallHelp = null;
    let pwaInstallPreviousFocus = null;
    let pwaInstallHelpRequest = 0;
    // 已安裝記號：從 App 開啟或安裝完成時記下，之後在一般分頁也隱藏「安裝」。
    // Chrome 再次提示可安裝（beforeinstallprompt）代表已解除安裝，會清除記號。
    const PWA_INSTALLED_KEY = 'clc_dx04_installed';
    let pwaKnownInstalled = false;
    try { pwaKnownInstalled = localStorage.getItem(PWA_INSTALLED_KEY) === '1'; } catch (_) {}
    function setPwaKnownInstalled(value) {
      pwaKnownInstalled = value;
      try { value ? localStorage.setItem(PWA_INSTALLED_KEY, '1') : localStorage.removeItem(PWA_INSTALLED_KEY); } catch (_) {}
    }

    function isPwaStandalone() {
      return pwaDisplayMode.matches || window.navigator.standalone === true;
    }

    function checkPwaInstalledState() {
      const btn = document.getElementById('installAppBtn');
      if (!btn) return;
      if (isPwaStandalone() && !pwaKnownInstalled) setPwaKnownInstalled(true);
      const installed = isPwaStandalone() || pwaInstalledInSession || pwaKnownInstalled;
      btn.hidden = installed;
      btn.classList.toggle('hidden', installed);
      btn.style.display = installed ? 'none' : '';
      btn.disabled = pwaInstallPromptPending;
      if (pwaInstallPromptPending) btn.setAttribute('aria-busy', 'true');
      else btn.removeAttribute('aria-busy');
      if (installed) closePwaInstallHelp();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW 失敗', err));
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (pwaKnownInstalled) setPwaKnownInstalled(false);
      const btn = document.getElementById('installAppBtn');
      if (btn) {
        btn.classList.add('bg-[#007E8A]/15', 'border-[#007E8A]/50', 'text-[#007E8A]', 'dark:text-teal-300');
      }
      checkPwaInstalledState();
    });

    window.addEventListener('appinstalled', () => {
      pwaInstalledInSession = true;
      setPwaKnownInstalled(true);
      deferredPrompt = null;
      checkPwaInstalledState();
    });

    async function pwaInstallInstructions() {
      const ua = navigator.userAgent;
      const isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        return [
          '使用 Safari 開啟目前這個 DX04 網址。',
          '點選 Safari 的「分享」按鈕，再選擇「加入主畫面」。',
          '確認名稱後點選「新增」，之後即可從主畫面開啟 CLC DX04。'
        ];
      }
      if (/Android/i.test(ua)) {
        return [
          '使用 Android Chrome 開啟目前這個 DX04 網址。',
          '點選右上角「⋮」選單，選擇「安裝應用程式」或「加入主畫面」。',
          '依畫面指示確認；完成後從主畫面或應用程式清單開啟 CLC DX04。'
        ];
      }
      let isBrave = false;
      try {
        isBrave = !!(navigator.brave && typeof navigator.brave.isBrave === 'function' &&
          await navigator.brave.isBrave());
      } catch (_) { /* 無法辨識時使用一般瀏覽器操作說明。 */ }
      if (isBrave) {
        return [
          '在 Brave 網址列右側尋找安裝圖示；或開啟右上角主選單，尋找「安裝 CLC DX04」或「安裝應用程式」。',
          '安裝項目可能位於「儲存與分享」或「投放、儲存與分享」子選單。',
          '若選單沒有安裝項目，可使用 Chrome 或 Edge 開啟目前這個 DX04 網址安裝。'
        ];
      }
      if (/Edg\//.test(ua)) {
        return [
          '在 Edge 網址列右側點選安裝圖示；或開啟右上角「⋯」選單。',
          '選擇「應用程式」→「將此網站安裝為應用程式」，再依畫面指示確認。',
          '完成後，從桌面或應用程式清單開啟 CLC DX04。'
        ];
      }
      if (/Chrome\//.test(ua)) {
        return [
          '在 Chrome 網址列右側點選安裝圖示；或開啟右上角「⋮」選單。',
          '尋找「安裝 CLC DX04」或「安裝網頁為應用程式」；安裝項目可能位於「投放、儲存與分享」內。',
          '依畫面指示確認後，從桌面或應用程式清單開啟 CLC DX04。'
        ];
      }
      return [
        '在目前瀏覽器的網址列或右上角選單，尋找「安裝應用程式」或「加入主畫面」。',
        '若沒有安裝項目，可使用 Chrome 或 Edge 開啟目前這個 DX04 網址安裝。'
      ];
    }

    function closePwaInstallHelp() {
      pwaInstallHelpRequest += 1;
      if (!pwaInstallHelp || pwaInstallHelp.style.display === 'none') return;
      pwaInstallHelp.style.display = 'none';
      document.removeEventListener('keydown', handlePwaInstallHelpKeydown, true);
      const previous = pwaInstallPreviousFocus;
      pwaInstallPreviousFocus = null;
      if (previous && previous.isConnected && !previous.hidden && !previous.disabled) previous.focus();
    }

    function handlePwaInstallHelpKeydown(event) {
      if (event.key === 'Escape') {
        event.preventDefault();
        event.stopImmediatePropagation();
        closePwaInstallHelp();
      } else if (event.key === 'Tab') {
        event.stopImmediatePropagation();
        const buttons = pwaInstallHelp.querySelectorAll('button');
        const first = buttons[0];
        const last = buttons[buttons.length - 1];
        if (event.shiftKey && (document.activeElement === first || !pwaInstallHelp.contains(document.activeElement))) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && (document.activeElement === last || !pwaInstallHelp.contains(document.activeElement))) {
          event.preventDefault();
          first.focus();
        }
      }
    }

    function createPwaInstallHelp() {
      const overlay = document.createElement('div');
      overlay.id = 'pwaInstallHelpOverlay';
      overlay.style.cssText = 'display:none;position:fixed;inset:0;z-index:2147483646;padding:16px;box-sizing:border-box;background:rgba(0,0,0,.7);align-items:center;justify-content:center;';
      overlay.innerHTML = `
        <section id="pwaInstallHelpDialog" role="dialog" aria-modal="true" aria-labelledby="pwaInstallHelpTitle" aria-describedby="pwaInstallHelpSummary pwaInstallHelpReason" style="box-sizing:border-box;width:100%;max-width:460px;max-height:calc(100% - 16px);overflow:auto;overscroll-behavior:contain;padding:24px;border:1px solid rgba(255,255,255,.15);border-radius:18px;background:#11131b;color:#f1f5f9;box-shadow:0 24px 70px rgba(0,0,0,.45);font:15px/1.7 system-ui,sans-serif;text-align:left;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
            <h2 id="pwaInstallHelpTitle" style="margin:0;font-size:20px;font-weight:800;">安裝 CLC DX04</h2>
            <button id="pwaInstallHelpClose" type="button" aria-label="關閉安裝說明" style="flex:none;width:36px;height:36px;border:1px solid #64748b;border-radius:9px;background:transparent;color:#f1f5f9;cursor:pointer;font-size:20px;">×</button>
          </div>
          <p id="pwaInstallHelpSummary" style="margin:16px 0 0;">目前瀏覽器未提供直接安裝提示。</p>
          <p id="pwaInstallHelpReason" style="display:none;margin:8px 0 0;color:#fde68a;"></p>
          <ol id="pwaInstallHelpSteps" style="margin:16px 0;padding-left:24px;list-style:decimal;"></ol>
          <p style="margin:0 0 20px;color:#cbd5e1;font-size:13px;">若已經安裝，請從桌面或應用程式清單開啟 CLC DX04。</p>
          <button id="pwaInstallHelpDone" type="button" style="width:100%;min-height:44px;padding:10px 16px;border:0;border-radius:10px;background:#007e8a;color:white;cursor:pointer;font-size:15px;font-weight:700;">知道了</button>
        </section>`;
      overlay.querySelector('#pwaInstallHelpClose').addEventListener('click', closePwaInstallHelp);
      overlay.querySelector('#pwaInstallHelpDone').addEventListener('click', closePwaInstallHelp);
      overlay.addEventListener('click', event => {
        if (event.target === overlay) closePwaInstallHelp();
      });
      document.body.appendChild(overlay);
      pwaInstallHelp = overlay;
    }

    async function openPwaInstallHelp(reason = '') {
      const request = ++pwaInstallHelpRequest;
      const steps = await pwaInstallInstructions();
      if (request !== pwaInstallHelpRequest || isPwaStandalone() || pwaInstalledInSession) return;
      if (!pwaInstallHelp) createPwaInstallHelp();
      const list = pwaInstallHelp.querySelector('#pwaInstallHelpSteps');
      list.replaceChildren();
      steps.forEach(text => {
        const item = document.createElement('li');
        item.textContent = text;
        item.style.marginBottom = '8px';
        list.appendChild(item);
      });
      const reasonElement = pwaInstallHelp.querySelector('#pwaInstallHelpReason');
      reasonElement.textContent = reason;
      reasonElement.style.display = reason ? '' : 'none';
      pwaInstallHelp.querySelector('#pwaInstallHelpSummary').textContent = reason
        ? '這次未能完成直接安裝，仍可使用下方方式操作。'
        : '目前瀏覽器未提供直接安裝提示。';
      if (pwaInstallHelp.style.display === 'none') pwaInstallPreviousFocus = document.activeElement;
      pwaInstallHelp.style.display = 'flex';
      document.addEventListener('keydown', handlePwaInstallHelpKeydown, true);
      pwaInstallHelp.querySelector('#pwaInstallHelpClose').focus();
    }

    window.triggerPwaInstall = async function() {
      if (isPwaStandalone() || pwaInstalledInSession) {
        checkPwaInstalledState();
        return;
      }
      if (pwaInstallPromptPending) return;
      if (!deferredPrompt) {
        await openPwaInstallHelp();
        return;
      }
      closePwaInstallHelp();
      const promptEvent = deferredPrompt;
      deferredPrompt = null;
      pwaInstallPromptPending = true;
      checkPwaInstalledState();
      try {
        // 在使用者的點擊內立即呼叫；同一份原生提示僅能使用一次。
        const result = await promptEvent.prompt();
        const choice = result && typeof result.outcome === 'string'
          ? result : await promptEvent.userChoice;
        // 使用者取消是正常選擇；只有 appinstalled 才判定本次確實安裝完成。
        if (choice && choice.outcome === 'dismissed') return;
      } catch (err) {
        console.warn('安裝提示未能開啟:', err);
        let reason = '這次安裝提示未能開啟，請使用瀏覽器選單安裝，或稍後再試。';
        if (err && err.name === 'NotAllowedError') {
          reason = '瀏覽器目前不允許開啟直接安裝提示，請使用下方選單方式安裝。';
        } else if (err && err.name === 'InvalidStateError') {
          reason = '這次安裝提示已失效，請使用下方選單方式安裝，或稍後再試。';
        } else if (err && err.name === 'AbortError') {
          reason = '這次安裝已取消；你可以稍後再試，或使用下方方式安裝。';
        }
        await openPwaInstallHelp(reason);
      } finally {
        pwaInstallPromptPending = false;
        checkPwaInstalledState();
      }
    };

    if (typeof pwaDisplayMode.addEventListener === 'function') {
      pwaDisplayMode.addEventListener('change', checkPwaInstalledState);
    } else if (typeof pwaDisplayMode.addListener === 'function') {
      pwaDisplayMode.addListener(checkPwaInstalledState);
    }
    document.addEventListener('DOMContentLoaded', checkPwaInstalledState);
    // 支援的瀏覽器（Chrome／Edge）直接詢問系統是否已安裝，只查一次。
    if (!isPwaStandalone() && typeof navigator.getInstalledRelatedApps === 'function') {
      navigator.getInstalledRelatedApps().then(apps => {
        // 只採用「已安裝」的結果；部分平台不支援偵測會回傳空清單，不據此判定未安裝。
        if (Array.isArray(apps) && apps.length > 0) setPwaKnownInstalled(true);
        checkPwaInstalledState();
      }).catch(() => {});
    }
  </script>
</body>
</html>
